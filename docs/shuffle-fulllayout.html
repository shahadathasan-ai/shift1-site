<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Full layout — Shuffle B&W vs red</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0b0b0b;--bg-card:#161616;--bg-card-back:#1a1a1a;--text:#e8e4de;--text-muted:#8a8580;--accent:#e8d5a3;--fh:'Space Grotesk',sans-serif;--fb:'Inter',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--fb);padding:44px 40px 100px}
  .lbl{font-family:var(--fh);font-weight:500;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:12px 0 26px;border-bottom:1px solid rgba(232,213,163,.14);padding-bottom:10px}
  .lbl:not(:first-of-type){margin-top:64px}

  .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:2rem}
  .card-container{perspective:1000px;height:400px}
  .card-container a{text-decoration:none;color:inherit;display:block;width:100%;height:100%}
  .card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1);cursor:pointer}
  .card-container:hover .card{transform:rotateY(180deg)}
  .card-container.no-flip:hover .card{transform:none}
  .card-front,.card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:8px;overflow:hidden}
  /* lowered titles: bottom padding trimmed so the text sits a touch lower */
  .card-front{background:var(--bg-card);display:flex;flex-direction:column;justify-content:flex-end;padding:2rem 2rem 1.35rem;border:1px solid rgba(255,255,255,.04)}
  .card-container:hover .card-front{border-color:rgba(201,185,154,.15)}
  .card-status{position:absolute;top:1.5rem;left:2rem;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;z-index:5}
  .status-complete{color:rgba(123,201,123,.6)}
  .status-progress{color:rgba(201,185,154,.6)}
  .card-category{font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:.75rem;font-weight:500}
  .card-title{font-family:var(--fh);font-size:1.5rem;font-weight:600;color:var(--text);margin-bottom:.5rem}
  .card-subtitle{font-size:.85rem;color:var(--text-muted)}
  .card-back{background:var(--bg-card-back);transform:rotateY(180deg);padding:2rem;display:flex;flex-direction:column;justify-content:center;border:1px solid rgba(201,185,154,.1)}
  .card-back .card-category{margin-bottom:1rem}
  .card-back-title{font-family:var(--fh);font-size:1.2rem;font-weight:600;color:var(--text);margin-bottom:1rem}
  .card-back-text{font-size:.9rem;color:var(--text-muted);line-height:1.7;margin-bottom:1.5rem}
  .card-back-meta{font-size:.75rem;color:var(--text-muted);letter-spacing:.05em;opacity:.6}
  .card-back-link{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:500}

  /* ---- Shuffle image tile (framing B, pole-safe) ---- */
  .tile-shuffle{padding:0;--imgh:62%}
  .tile-shuffle .tile-bg{position:absolute;left:0;right:0;top:0;height:var(--imgh);z-index:0;background:url('read/frames/plaza.jpg') no-repeat;background-size:auto 118%;background-position:center 0%}
  .tile-shuffle .edge{position:absolute;left:0;right:0;height:60px;top:calc(var(--imgh) - 60px);z-index:2;background:linear-gradient(to bottom,transparent,rgba(11,11,11,.4))}
  .tile-shuffle .tile-panel{position:absolute;left:0;right:0;top:var(--imgh);bottom:0;z-index:4;background:var(--bg-card);border-top:1px solid rgba(232,213,163,.14);padding:0 2rem 1.35rem;display:flex;flex-direction:column;justify-content:flex-end}
  .tile-shuffle .card-status{color:rgba(123,201,123,.85);text-shadow:0 1px 8px rgba(0,0,0,.85)}
  .sh-bw .tile-bg{filter:grayscale(1) contrast(1.42) brightness(.82)}
  .sh-red::before{content:'';position:absolute;left:0;right:0;top:0;height:var(--imgh);z-index:0;background:linear-gradient(155deg,#1d0606,#e2685a)}
  .sh-red .tile-bg{z-index:1;mix-blend-mode:luminosity;filter:contrast(1.08) brightness(1.05)}

  /* ---- NYC gold logo tile ---- */
  .tile-nyc{padding:0;--imgh:62%}
  .tile-nyc .logo-area{position:absolute;left:0;right:0;top:0;height:var(--imgh);z-index:0;display:flex;align-items:center;justify-content:center;background:#161616}
  .tile-nyc .logo-area img{width:46%;height:auto;filter:invert(1) sepia(1) saturate(3.6) hue-rotate(4deg) brightness(.95)}
  .tile-nyc .tile-panel{position:absolute;left:0;right:0;top:var(--imgh);bottom:0;z-index:4;background:var(--bg-card);border-top:1px solid rgba(232,213,163,.14);padding:0 2rem 1.35rem;display:flex;flex-direction:column;justify-content:flex-end}
</style>
</head>
<body>
  <div class="lbl">Full page — Shuffle in Black &amp; white · NYC Midnight in Gold</div>
  <div class="projects-grid" id="bw"></div>

  <div class="lbl">Full page — Shuffle in Horror red · NYC Midnight in Gold</div>
  <div class="projects-grid" id="red"></div>

<script>
  const nyc = () => `<div class="card-container"><div class="card">
    <div class="card-front tile-nyc"><div class="logo-area"><img src="read/frames/nyc-logo.webp" alt="NYC Midnight"></div><div class="card-status status-complete">Complete</div>
      <div class="tile-panel"><div class="card-category">Competition</div><div class="card-title">NYC Midnight</div><div class="card-subtitle">Timed story competition</div></div></div>
    <div class="card-back"><div class="card-category">NYC Midnight</div><div class="card-back-title">4 Competitions</div><div class="card-back-text">Scary Story — 2025<br>Screenwriting — 2025<br>Screenwriting — 2026<br>Short Story — 2026</div><span class="card-back-link">View entries &rarr;</span></div>
  </div></div>`;

  const shuffle = (cls) => `<div class="card-container"><div class="card">
    <div class="card-front tile-shuffle ${cls}"><div class="tile-bg"></div><div class="edge"></div><div class="card-status status-complete">Complete</div>
      <div class="tile-panel"><div class="card-category">Feature Screenplay</div><div class="card-title">Shuffle</div><div class="card-subtitle">Horror</div></div></div>
    <div class="card-back"><div class="card-category">Feature Screenplay</div><div class="card-back-title">Shuffle</div><div class="card-back-text">A college student pulling an all-nighter in an empty science lab is pricked by an unknown needle. What follows is a spiral between reality and something far stranger.</div><span class="card-back-link">Read the script &rarr;</span></div>
  </div></div>`;

  const flip = (st,stt,cat,ti,sub,bt,txt,meta) => `<div class="card-container"><div class="card">
    <div class="card-front"><div class="card-status ${st}">${stt}</div><div class="card-category">${cat}</div><div class="card-title">${ti}</div><div class="card-subtitle">${sub}</div></div>
    <div class="card-back"><div class="card-category">${cat}</div><div class="card-back-title">${bt}</div><div class="card-back-text">${txt}</div><div class="card-back-meta"><span>${meta}</span></div></div>
  </div></div>`;

  const noflip = (cat,ti,sub) => `<div class="card-container no-flip"><div class="card">
    <div class="card-front"><div class="card-status status-progress">In Progress</div><div class="card-category">${cat}</div><div class="card-title">${ti}</div><div class="card-subtitle">${sub}</div></div>
  </div></div>`;

  const icarus = flip('status-complete','Complete','Animated Pilot','Icarus','Comedy / Sci-Fi','Icarus','An outcast teenager becomes the unlikely leader of an alien universe on the brink of collapse. She didn\'t ask for the job — and they didn\'t ask for her.','Format: Animated Pilot / 22 min');
  const lion = flip('status-progress','In Progress','Novel','Lyon Street','Biopic','Lyon Street','A teenage girl arrives in a foreign country barely speaking the language. She finds a close community of others like her, and together they make their way in a new world.','Format: Novel');
  const rest = () => noflip('Feature Screenplay','Bombshell','Comedy') + noflip('Feature Screenplay','God has No Family','Thriller / Sci-Fi') + noflip('Feature Screenplay','Nostradamus','Romantic Comedy');

  const grid = (shuf) => nyc() + icarus + shuf + lion + rest();
  document.getElementById('bw').innerHTML  = grid(shuffle('sh-bw'));
  document.getElementById('red').innerHTML = grid(shuffle('sh-red'));
</script>
</body>
</html>
