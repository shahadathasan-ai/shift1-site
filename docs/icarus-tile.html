<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Icarus tile — options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0b0b0b;--bg-card:#161616;--bg-card-back:#1a1a1a;--text:#e8e4de;--text-muted:#8a8580;--accent:#e8d5a3;--fh:'Space Grotesk',sans-serif;--fb:'Inter',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--fb);padding:48px 44px 120px}
  h1{font-family:var(--fh);font-weight:600;font-size:1.45rem}
  .intro{color:var(--text-muted);max-width:820px;margin:14px 0 6px;font-size:.9rem;line-height:1.65}
  .note{color:var(--text-muted);font-size:.8rem;opacity:.65;margin-bottom:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2.6rem 2rem;max-width:1280px}
  .opt .cap{margin-top:14px;font-size:.78rem;color:var(--text-muted);line-height:1.5}
  .opt .cap b{display:block;color:var(--text);font-family:var(--fh);font-weight:600;font-size:.84rem;margin-bottom:3px}

  .card-container{perspective:1000px;height:400px}
  .card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1)}
  .card-container:hover .card{transform:rotateY(180deg)}
  .card-front,.card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:8px;overflow:hidden}
  .card-front{background:var(--bg-card);border:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;justify-content:flex-end;padding:2rem 2rem 1.35rem}
  .card-back{background:var(--bg-card-back);transform:rotateY(180deg);padding:2rem;display:flex;flex-direction:column;justify-content:center;border:1px solid rgba(232,213,163,.1)}
  .card-status{position:absolute;top:1.5rem;left:2rem;z-index:5;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:rgba(123,201,123,.6)}
  .card-category{font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:.75rem;font-weight:500}
  .card-title{font-family:var(--fh);font-size:1.5rem;font-weight:600;color:var(--text);margin-bottom:.5rem}
  .card-subtitle{font-size:.85rem;color:var(--text-muted)}
  .card-back-title{font-family:var(--fh);font-size:1.2rem;font-weight:600;color:var(--text);margin:0 0 1rem}
  .card-back .card-category{margin-bottom:1rem}
  .card-back-text{font-size:.9rem;color:var(--text-muted);line-height:1.7;margin-bottom:1.4rem}
  .card-back-meta{font-size:.75rem;color:var(--text-muted);letter-spacing:.05em;opacity:.6}

  /* icarus image tile */
  .tile-ic{padding:0;--imgh:62%}
  .tile-ic .tile-bg{position:absolute;left:0;right:0;top:0;height:var(--imgh);z-index:0;background:url('read/frames/icarus.jpg') center/cover no-repeat}
  .tile-ic .edge{position:absolute;left:0;right:0;height:60px;top:calc(var(--imgh) - 60px);z-index:2;background:linear-gradient(to bottom,transparent,rgba(11,11,11,.4))}
  .tile-ic .tile-panel{position:absolute;left:0;right:0;top:var(--imgh);bottom:0;z-index:4;background:var(--bg-card);border-top:1px solid rgba(232,213,163,.14);padding:0 2rem 1.35rem;display:flex;flex-direction:column;justify-content:flex-end}
  .tile-ic .card-status{color:rgba(123,201,123,.9);text-shadow:0 1px 8px rgba(0,0,0,.85)}
  .ic-zoom .tile-bg{background-size:auto 150%}
  /* full-bleed */
  .tile-ic.bleed .tile-bg{height:100%}
  .tile-ic.bleed .tile-panel{top:auto;height:auto;background:transparent;border:0;padding:1.9rem}
  .tile-ic.bleed .edge{display:none}
  .tile-ic.bleed .shade{position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(8,8,9,.92) 5%,rgba(8,8,9,.5) 30%,transparent 56%)}
  .tile-ic.bleed .card-title{text-shadow:0 1px 12px rgba(0,0,0,.6)}
</style>
</head>
<body>
  <h1>Icarus tile — options</h1>
  <div class="intro">Your sci-fi frame as the Icarus card (figure is centred, so it holds the portrait crop). Matches the site style — Complete status, lowered title, flips to the synopsis on hover. Reference = the current no-image card.</div>
  <div class="note">read/frames/icarus.jpg · 1456×816</div>

  <div class="grid" id="g"></div>

<script>
  const back = `<div class="card-back"><div class="card-category">Animated Pilot</div><div class="card-back-title">Icarus</div><div class="card-back-text">An outcast teenager becomes the unlikely leader of an alien universe on the brink of collapse. She didn't ask for the job — and they didn't ask for her.</div><div class="card-back-meta"><span>Format: Animated Pilot / 22 min</span></div></div>`;
  const panel = `<div class="tile-panel"><div class="card-category">Animated Pilot</div><div class="card-title">Icarus</div><div class="card-subtitle">Comedy / Sci-Fi</div></div>`;
  const imgFront = (cls, extra='') => `<div class="card-front tile-ic ${cls}"><div class="tile-bg"></div><div class="edge"></div>${extra}<div class="card-status">Complete</div>${panel}</div>`;
  const plainFront = `<div class="card-front"><div class="card-status">Complete</div><div class="card-category">Animated Pilot</div><div class="card-title">Icarus</div><div class="card-subtitle">Comedy / Sci-Fi</div></div>`;
  const tile = (f, n, name, desc) => `<div class="opt"><div class="card-container"><div class="card">${f}${back}</div></div><div class="cap"><b>${n} · ${name}</b><span>${desc}</span></div></div>`;

  document.getElementById('g').innerHTML = [
    tile(plainFront,                                     '0', 'Current',      'no image (reference)'),
    tile(imgFront(''),                                   '1', '2/3',          'picture up top, title on panel'),
    tile(imgFront('ic-zoom'),                            '2', '2/3 · zoomed', 'tighter on the figure + screen'),
    tile(imgFront('bleed','<div class="shade"></div>'),  '3', 'Full-bleed',   'image fills the whole tile, title over a fade'),
  ].join('');
</script>
</body>
</html>
