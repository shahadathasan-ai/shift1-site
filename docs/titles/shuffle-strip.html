<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SHUFFLE strip</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <script src="shuffle-engine.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000; overflow: hidden; }
    /* Frames stacked vertically so one screenshot yields many frames.
       Cuts Chrome launches by the strip length — 196 one-shot launches
       thrashed the machine; 14 strips of 14 do not. */
    .f { container-type: size; position: relative; background: #000; overflow: hidden; }
    .stack { position: absolute; inset: 0; display: grid; place-items: center; }
    .shuffle { font-family: 'Inter', sans-serif; font-weight: 200; font-size: 11cqh;
               letter-spacing: 1.85em; white-space: nowrap; line-height: 1; display: flex;
               color: var(--lit); }
    .shuffle .ch { opacity: var(--o,0); --bm: 1;
      text-shadow:
        0 0 .038em rgba(var(--glow), calc(.42 * var(--bm) * var(--bt))),
        0 0 .125em rgba(var(--glow), calc(.20 * var(--bm) * var(--bt))),
        0 0 .38em  rgba(var(--glow), calc(.075 * var(--bm) * var(--bt))),
        0 0 .95em  rgba(var(--glow), calc(.024 * var(--bm) * var(--bt))); }
    .shuffle .ch:last-child { margin-right: -1.85em; }
    .bats { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 3.5cqh;
            letter-spacing: .52em; white-space: nowrap; line-height: 1;
            color: var(--bats-lit); opacity: 0;
            transform: translateY(var(--drop, 20cqh));
            text-shadow: 0 0 .022em rgba(var(--bats-glow), .085); }
  </style>
</head>
<body><div id="strip"></div>
<script>
const E = window.ShuffleEngine;
const TUBE = { A:'#f2ecc9', B:'#ecedbf', C:'#f5e7b4', D:'#f0f0ea' };
const q = {};
location.hash.slice(1).split('&').forEach(function (kv) {
  if (!kv) return; const a = kv.split('='); q[a[0]] = a[1];
});
const W = parseInt(q.w || 1920, 10), H = parseInt(q.h || 804, 10);
const FROM = parseInt(q.from || 0, 10), COUNT = parseInt(q.count || 14, 10);
const tubeKey = TUBE[q.tube] ? q.tube : 'C';
const bloom = q.bloom !== undefined ? parseFloat(q.bloom) : 1.40;
const drop  = q.drop  !== undefined ? parseFloat(q.drop)  : 20;
const dim   = q.dim   !== undefined ? parseFloat(q.dim)   : 0.50;
const speed = q.speed !== undefined ? parseFloat(q.speed) : 1;
if (q.decay !== undefined) E.SEQ.shuffleOutF = parseInt(q.decay, 10);

const hex2rgb = h => [1,3,5].map(i => parseInt(h.substr(i,2),16));
const rgb2hex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
const batsHexFor = h => rgb2hex(hex2rgb(h).map((v,i) => v*0.72 + [201,200,192][i]*0.28));
const lit = TUBE[tubeKey], bh = batsHexFor(lit);

const strip = document.getElementById('strip');
strip.style.width = W + 'px';

for (let k = 0; k < COUNT; k++) {
  const fno = FROM + k;
  const t = fno / (E.FPS * speed);

  const box = document.createElement('div');
  box.className = 'f';
  box.style.width = W + 'px'; box.style.height = H + 'px';
  box.style.setProperty('--lit', lit);
  box.style.setProperty('--glow', hex2rgb(lit).join(','));
  box.style.setProperty('--bt', bloom);
  box.style.setProperty('--bats-lit', bh);
  box.style.setProperty('--bats-glow', hex2rgb(bh).join(','));
  box.style.setProperty('--drop', drop + 'cqh');

  const s1 = document.createElement('div'); s1.className = 'stack';
  const sh = document.createElement('div'); sh.className = 'shuffle';
  for (let i = 0; i < E.N; i++) {
    const c = document.createElement('span'); c.className = 'ch'; c.textContent = E.WORD[i];
    const b = E.shuffleAt(t, i);
    const bm = b > 1 ? 1 + (b-1)*2.6 : b;
    c.style.setProperty('--o', Math.min(1,b).toFixed(5));
    c.style.setProperty('--bm', Math.max(0,bm).toFixed(5));
    sh.appendChild(c);
  }
  s1.appendChild(sh);

  const s2 = document.createElement('div'); s2.className = 'stack';
  const bt = document.createElement('div'); bt.className = 'bats';
  bt.appendChild(Object.assign(document.createElement('span'), { textContent: E.BATS_TEXT }));
  bt.style.opacity = (E.batsAt(t) / E.BATS_PEAK * dim).toFixed(5);
  s2.appendChild(bt);

  box.appendChild(s1); box.appendChild(s2);
  strip.appendChild(box);
}

window.STRIP_INFO = { from: FROM, count: COUNT, w: W, h: H, tube: tubeKey,
                      bloom: bloom, drop: drop, dim: dim, speed: speed,
                      decay: E.SEQ.shuffleOutF, totalFrames: E.SEQ.frames * speed };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { window.STRIP_READY = true; });
</script>
</body>
</html>
