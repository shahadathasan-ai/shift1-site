<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
<meta name="googlebot" content="noindex,nofollow" />
<title>Icarus</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0a0a0b;--ink:#e7e1d4;--dim:#8b8578;--faint:#5c574d;--amber:#e8b63c;--red:#c8492f;--fh:'Space Grotesk',system-ui,sans-serif;--fs:'Courier Prime',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--fs);min-height:100vh;
    background-image:radial-gradient(120% 80% at 50% -10%, rgba(232,182,60,0.05), transparent 55%)}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070708}
  .gate-box{text-align:center;padding:30px;max-width:360px}
  .brand{font-family:var(--fh);font-weight:700;letter-spacing:0.28em;font-size:0.8rem;color:var(--faint);margin-bottom:26px}
  .brand b{color:var(--amber)}
  .gate-title{font-family:var(--fh);font-weight:700;letter-spacing:0.42em;font-size:1.7rem;color:var(--ink);text-indent:0.42em}
  .gate-sub{color:var(--dim);font-size:0.74rem;letter-spacing:0.18em;text-transform:uppercase;margin:12px 0 22px}
  #gate-form{display:flex;gap:8px;justify-content:center}
  #pw{background:#111113;border:1px solid #26251f;color:var(--ink);font-family:var(--fs);font-size:0.95rem;padding:10px 12px;border-radius:5px;width:150px;text-align:center;letter-spacing:0.3em}
  #pw:focus{outline:none;border-color:var(--amber)}
  #gate-form button{font-family:var(--fh);font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#0a0a0b;background:var(--amber);border:0;border-radius:5px;padding:0 16px;cursor:pointer}
  .gate-msg{color:var(--dim);font-size:0.72rem;letter-spacing:0.1em;margin-top:16px;min-height:1em}
  .shake{animation:shake .38s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style>
</head>
<body>
  <div id="gate">
    <div class="gate-box">
      <div class="brand">SH<b>1</b>FT · ICARUS</div>
      <div class="gate-title">ICARUS</div>
      <div class="gate-sub">Locked draft — coming soon</div>
      <form id="gate-form" autocomplete="off">
        <input id="pw" type="password" autocomplete="off" aria-label="password" />
        <button type="submit">Enter</button>
      </form>
      <div class="gate-msg" id="msg"></div>
    </div>
  </div>
<script>
  // placeholder gate — no script published yet, so nothing unlocks (the field is intentionally inert)
  document.getElementById('gate-form').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('msg').textContent = 'Not yet available — check back soon.';
    var b = document.querySelector('.gate-box');
    b.classList.add('shake'); setTimeout(function () { b.classList.remove('shake'); }, 400);
    document.getElementById('pw').select();
  });
</script>
</body>
</html>
