<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Shift1 — Stories (sliding reel)</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root{
      --bg:#0b0b0b; --bg-card:#161616; --bg-card-back:#1a1a1a;
      --text:#e8e4de; --text-muted:#8a8580;
      --accent:#e8d5a3; --accent-dim:rgba(201,185,154,.12);
      --font-heading:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
    }
    html{ scroll-behavior:smooth; scroll-snap-type:y mandatory; }
    body{ background:var(--bg); color:var(--text); font-family:var(--font-body);
      font-weight:300; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden; }

    /* ─── the fireflies, unchanged from index.html ─── */
    .particles{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .particle{ position:absolute; background:var(--accent); border-radius:50%;
      opacity:0; animation:firefly ease-in-out infinite; }
    @keyframes firefly{
      0%{opacity:0;transform:translate(0,0)} 25%{opacity:.4}
      50%{opacity:.15;transform:translate(30px,-60px)} 75%{opacity:.32}
      100%{opacity:0;transform:translate(-20px,-120px)}
    }

    nav{ position:fixed; top:0; width:100%; padding:1.5rem 3rem; display:flex;
      justify-content:space-between; align-items:center; z-index:100;
      background:linear-gradient(to bottom,var(--bg) 60%,transparent); }
    .nav-logo{ font-family:var(--font-heading); font-size:1rem; font-weight:600;
      letter-spacing:.15em; color:var(--text); text-decoration:none; }
    .nav-links{ display:flex; gap:2.5rem; list-style:none; }
    .nav-links a{ font-size:.8rem; letter-spacing:.1em; text-transform:uppercase;
      color:var(--text-muted); text-decoration:none; transition:color .3s; }
    .nav-links a:hover{ color:var(--text); }

    .hero{ height:100dvh; display:flex; flex-direction:column; justify-content:center;
      align-items:center; position:relative; z-index:1; scroll-snap-align:start; }
    .hero-logo{ margin-bottom:2rem; }
    .logo-text{ font-family:var(--font-heading); font-size:clamp(4rem,10vw,8rem);
      font-weight:700; letter-spacing:.08em; line-height:1; }
    .logo-text .one{ color:var(--accent); }
    .hero-sub{ font-size:.85rem; letter-spacing:.35em; text-transform:uppercase;
      color:var(--text-muted); margin-top:.75rem; text-align:center; text-indent:.35em; }
    .hero-line{ width:40px; height:1px; background:var(--accent); margin-top:3rem; opacity:.5; }
    .scroll-hint{ position:absolute; bottom:8rem; display:flex; flex-direction:column;
      align-items:center; gap:.4rem; color:var(--accent); text-decoration:none;
      animation:bounce 2s ease-in-out infinite; }
    .scroll-label{ font-size:.65rem; letter-spacing:.2em; text-transform:uppercase; }
    @keyframes bounce{ 0%,100%{opacity:.8;transform:translateY(0)} 50%{opacity:1;transform:translateY(8px)} }

    /* ─── the sliding reel ─────────────────────────────── */
    #stories{ height:100dvh; position:relative; z-index:1; scroll-snap-align:start;
      display:flex; flex-direction:column; justify-content:center; overflow:hidden; }

    .gate{ position:relative; }
    .band{ position:absolute; left:0; right:0; background:#0f0f0f;
      border-top:1px solid #1e1e1e; border-bottom:1px solid #1e1e1e; z-index:0; }
    .rail{ position:absolute; left:0; right:0; height:15px; z-index:0;
      background:repeating-linear-gradient(90deg,transparent 0 13px,#1d1d1d 13px 26px);
      animation:perf 6s linear infinite; }
    @keyframes perf{ to{ background-position:-26px 0 } }

    /* one long reel you drag.  A native scroller, so trackpad and touch
       momentum come for free. */
    #reel{
      position:relative; z-index:1; display:flex; gap:16px; align-items:center;
      overflow-x:auto; overflow-y:hidden; padding:22px 0; scroll-padding-left:84px;
      scroll-snap-type:x proximity; scrollbar-width:none; -ms-overflow-style:none;
      cursor:grab; overscroll-behavior-x:contain;
    }
    #reel::-webkit-scrollbar{ display:none }
    #reel.dragging{ cursor:grabbing; scroll-snap-type:none; scroll-behavior:auto }
    #reel.dragging .flipper{ transition:none }
    .pad{ flex:0 0 auto }

    .frame{ flex:0 0 auto; perspective:1600px; scroll-snap-align:start;
      opacity:0; transform:translateX(70px) scale(.96);
      transition:opacity .6s ease, transform .85s cubic-bezier(.16,.84,.34,1); }
    .frame.in{ opacity:1; transform:none; }

    .flipper{ position:relative; width:100%; height:100%; transform-style:preserve-3d;
      transition:transform .75s cubic-bezier(.4,.1,.2,1); }
    .frame.can-flip:hover .flipper, .frame.can-flip.on .flipper{ transform:rotateY(180deg); }

    .face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
      background:var(--bg-card); border:1px solid #232323; border-radius:3px; overflow:hidden;
      display:flex; flex-direction:column; text-decoration:none; color:inherit;
      transition:border-color .3s, box-shadow .3s; }
    .frame:hover .face{ border-color:var(--accent-dim); box-shadow:0 18px 52px rgba(0,0,0,.72); }
    .back{ transform:rotateY(180deg); background:var(--bg-card-back);
      padding:20px 20px; justify-content:center; }

    .art{ position:relative; flex:0 0 auto; height:var(--artH); background:#161616; overflow:hidden; }
    .art img{ width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; }
    .art.logo{ display:flex; align-items:center; justify-content:center; }
    .art.logo img{ width:52%; height:auto; object-fit:contain;
      filter:invert(1) sepia(1) saturate(3.6) hue-rotate(4deg) brightness(.95); }
    .art.none{ background:repeating-linear-gradient(135deg,#141414 0 10px,#181818 10px 20px); }
    .art.none::after{ content:'NO ARTWORK YET'; position:absolute; top:10px; right:12px;
      font-family:var(--font-heading); font-size:8px; letter-spacing:.16em; color:#3c3a37; }

    .cap{ flex:1; padding:14px 16px; display:flex; flex-direction:column; justify-content:center; }
    .card-category{ font-family:var(--font-heading); font-size:.62rem; letter-spacing:.2em;
      text-transform:uppercase; color:var(--accent); opacity:.85; }
    .card-title{ font-family:var(--font-heading); font-size:1.25rem; font-weight:600;
      letter-spacing:-.01em; margin-top:4px; }
    .card-subtitle{ font-size:.78rem; color:var(--text-muted); margin-top:2px; }
    .card-back-title{ font-family:var(--font-heading); font-size:1.2rem; font-weight:600; }
    .card-back-text{ font-size:.82rem; line-height:1.6; color:var(--text-muted); margin-top:.6rem; }
    .card-back-link{ font-size:.75rem; letter-spacing:.08em; color:var(--accent); margin-top:1rem; }

    /* ─── the controls ─────────────────────────────────── */
    .arrow{ position:absolute; top:50%; transform:translateY(-50%); z-index:5;
      width:44px; height:44px; border:1px solid #2a2a2a; border-radius:50%;
      background:rgba(11,11,11,.72); backdrop-filter:blur(6px);
      color:var(--text-muted); font-size:15px; line-height:1; display:grid; place-items:center;
      transition:.25s; opacity:.85; }
    .arrow:hover{ color:var(--accent); border-color:var(--accent); opacity:1 }
    .arrow[disabled]{ opacity:.18; pointer-events:none }
    #prev{ left:26px } #next{ right:26px }

    .track{ position:absolute; left:50%; transform:translateX(-50%); bottom:3.4rem;
      width:min(300px,42vw); height:1px; background:#242424; z-index:5; }
    .track i{ position:absolute; left:0; top:-1px; height:3px; background:var(--accent);
      opacity:.8; border-radius:2px; transition:width .12s linear, left .12s linear; }

    @media (max-width:900px){
      nav{ padding:1.2rem 1.4rem }
      #prev,#next{ display:none }
      #reel{ gap:12px }
      .track{ bottom:2.2rem }
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <nav>
    <a href="#" class="nav-logo">SH1FT</a>
    <ul class="nav-links">
      <li><a href="#stories">Stories</a></li>
      <li><a href="#stories">Contact</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="hero-logo">
      <div class="logo-text">SH<span class="one">1</span>FT</div>
      <div class="hero-sub">Studios</div>
    </div>
    <div class="hero-line"></div>
    <a href="#stories" class="scroll-hint"><span class="scroll-label">Stories</span>&#8595;</a>
  </section>

  <section id="stories">
    <div class="gate">
      <div class="band" id="band"></div>
      <div class="rail" id="railTop"></div>
      <div class="rail" id="railBot"></div>
      <div id="reel"></div>
    </div>
    <button class="arrow" id="prev" aria-label="Previous">&#8592;</button>
    <button class="arrow" id="next" aria-label="Next">&#8594;</button>
    <div class="track"><i id="bar"></i></div>
  </section>

<script>
const F = 'read/frames/';
const STORIES = [
  { t:'NYC Midnight', k:'Competition', g:'Short story competition',
    img:F+'nyc-logo.webp', logo:true, href:'nyc-midnight.html',
    backTitle:'4 Competitions',
    back:'Scary Story · Screenwriting · Short Story. Four challenges, 2025 and 2026.',
    link:'View entries &rarr;' },
  { t:'Shuffle', k:'Short Film', g:'Horror', img:F+'shuffle-tile-v2.png', href:'shuffle.html',
    backTitle:'Shuffle',
    back:'Some night shifts are quieter than others. For one laboratory worker, the silence is only the beginning. Based on a true story.',
    link:'See short video &rarr;' },
  { t:'Icarus', k:'Animated Pilot', g:'Comedy / Sci-Fi', img:F+'icarus.jpg', href:'read/icarus.html',
    backTitle:'Icarus',
    back:"An outcast teenager becomes the unlikely leader of an alien universe on the brink of collapse. She didn't ask for the job — and they didn't ask for her.",
    link:'Read the script &rarr;' },
  { t:'Lyon Street', k:'Novel', g:'Biopic', img:F+'lyon-street.jpg',
    backTitle:'Lyon Street',
    back:'A teenage girl arrives in a foreign country barely speaking the language. She finds a close community of others like her, and together they make their way in a new world.' },
  { t:'Bombshell', k:'Feature Screenplay', g:'Comedy', img:null },
  { t:'God has No Family', k:'Feature Screenplay', g:'Thriller / Sci-Fi', img:F+'god-has-no-family.jpg' },
  { t:'Nostradamus', k:'Feature Screenplay', g:'Romantic Comedy', img:null },
];

const reel = document.getElementById('reel');
const sect = document.getElementById('stories');
/* declared up here because layout() calls progress(), which uses them —
   leaving them below threw a temporal-dead-zone error that killed the
   whole script, fireflies and reveal included */
const prev = document.getElementById('prev'),
      next = document.getElementById('next'),
      bar  = document.getElementById('bar');

function art(s){
  if(!s.img) return '<div class="art none"></div>';
  if(s.logo) return `<div class="art logo"><img src="${s.img}" alt="${s.t}" draggable="false"></div>`;
  return `<div class="art"><img src="${s.img}" alt="${s.t}" draggable="false"></div>`;
}

function layout(){
  /* clientWidth, not innerWidth — innerWidth counts the scrollbar */
  const W = document.documentElement.clientWidth,
        H = document.documentElement.clientHeight;

  /* Because the reel slides, the frames are no longer squeezed to fit seven
     across.  Sized so roughly three sit on screen at a time. */
  const tw   = W < 900 ? Math.min(W*0.78, (H - 190)*1.45)
                       : Math.min(W*0.33, 560, (H - 210)*1.45);
  const artH = Math.round(tw/(16/9));
  const th   = artH + Math.max(74, Math.min(104, tw*0.2));
  /* a plain gutter, not half a screen: the reel should open with frames
     filling it from the left, not one card marooned in the middle */
  /* wide enough on desktop that the arrows sit in the gutter rather than
     on top of the first card's artwork */
  const pad  = W < 900 ? 16 : 84;

  reel.innerHTML =
    `<div class="pad" style="width:${pad}px"></div>` +
    STORIES.map((s,i)=>{
      const flip = !!s.back, tag = s.href ? 'a' : 'div', href = s.href ? ` href="${s.href}"` : '';
      return `<article class="frame${flip?' can-flip':''}" data-i="${i}"
        style="width:${tw}px;height:${th}px;--artH:${artH}px;transition-delay:${i*70}ms">
        <div class="flipper">
          <${tag}${href} class="face front">
            ${art(s)}
            <div class="cap">
              <div class="card-category">${s.k}</div>
              <div class="card-title">${s.t}</div>
              <div class="card-subtitle">${s.g}</div>
            </div>
          </${tag}>
          ${flip ? `<${tag}${href} class="face back">
            <div class="card-back-title">${s.backTitle}</div>
            <div class="card-back-text">${s.back}</div>
            ${s.link ? `<div class="card-back-link">${s.link}</div>` : ''}
          </${tag}>` : ''}
        </div>
      </article>`;
    }).join('') +
    `<div class="pad" style="width:${pad}px"></div>`;

  const h = th + 44;
  const band = document.getElementById('band');
  band.style.top = '0px'; band.style.height = h+'px';
  document.getElementById('railTop').style.top = '0px';
  document.getElementById('railBot').style.top = (h-15)+'px';
  STEP = tw + 16;
  progress();
}
let STEP = 400;
layout();
let rt; addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(()=>{ layout(); if(threaded) show(); }, 180); });

/* ── the frames thread in on arrival ── */
let threaded = false;
function show(){ reel.querySelectorAll('.frame').forEach(f=>f.classList.add('in')); }
function thread(){ if(threaded) return; threaded = true; show(); }
new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting) thread(); }); },
  { threshold:.25 }).observe(sect);
addEventListener('scroll', ()=>{
  if(sect.getBoundingClientRect().top < innerHeight*0.75) thread();
}, { passive:true });

/* ── drag to slide ── */
let down = false, moved = false, startX = 0, startL = 0;
reel.addEventListener('pointerdown', e=>{
  down = true; moved = false; startX = e.clientX; startL = reel.scrollLeft;
  reel.setPointerCapture(e.pointerId);
});
reel.addEventListener('pointermove', e=>{
  if(!down) return;
  const dx = e.clientX - startX;
  if(!moved && Math.abs(dx) > 5){ moved = true; reel.classList.add('dragging'); }
  if(moved) reel.scrollLeft = startL - dx;
});
function endDrag(e){
  if(!down) return;
  down = false;
  if(moved) setTimeout(()=>reel.classList.remove('dragging'), 0);
  try{ reel.releasePointerCapture(e.pointerId); }catch(_){}
}
reel.addEventListener('pointerup', endDrag);
reel.addEventListener('pointercancel', endDrag);
/* a drag must never count as a click on the card underneath */
reel.addEventListener('click', e=>{ if(moved){ e.preventDefault(); e.stopPropagation(); } }, true);

/* a vertical wheel slides the reel while the pointer is over it */
reel.addEventListener('wheel', e=>{
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ reel.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive:false });

/* ── arrows, keys and the progress bar ── */
function progress(){
  const max = reel.scrollWidth - reel.clientWidth;
  const p = max > 0 ? reel.scrollLeft/max : 0;
  const w = max > 0 ? Math.max(14, reel.clientWidth/reel.scrollWidth*100) : 100;
  bar.style.width = w+'%';
  bar.style.left  = (p*(100-w))+'%';
  /* snapping leaves a few pixels on the clock at rest, so 40 not 4 */
  prev.disabled = reel.scrollLeft < 40;
  next.disabled = reel.scrollLeft > max - 4;
}
reel.addEventListener('scroll', progress, { passive:true });
prev.onclick = ()=> reel.scrollBy({ left:-STEP, behavior:'smooth' });
next.onclick = ()=> reel.scrollBy({ left: STEP, behavior:'smooth' });
addEventListener('keydown', e=>{
  if(sect.getBoundingClientRect().top > innerHeight*0.5) return;   /* only on this screen */
  if(e.key==='ArrowRight'){ reel.scrollBy({left:STEP,behavior:'smooth'}); e.preventDefault(); }
  if(e.key==='ArrowLeft'){  reel.scrollBy({left:-STEP,behavior:'smooth'}); e.preventDefault(); }
});

/* tap to turn a card over where there is no hover */
if(matchMedia('(hover:none)').matches){
  reel.addEventListener('click', e=>{
    const f = e.target.closest('.frame.can-flip');
    if(f && !moved){ e.preventDefault(); f.classList.toggle('on'); }
  });
}

/* ── the fireflies ── */
const container = document.getElementById('particles');
for(let i=0;i<40;i++){
  const p = document.createElement('div');
  p.classList.add('particle');
  p.style.left = Math.random()*100+'%'; p.style.top = Math.random()*100+'%';
  const size = 2 + Math.random()*2;
  p.style.width = size+'px'; p.style.height = size+'px';
  p.style.animationDuration = (8+Math.random()*8)+'s';
  p.style.animationDelay = (Math.random()*1)+'s';
  container.appendChild(p);
}
</script>
</body>
</html>
