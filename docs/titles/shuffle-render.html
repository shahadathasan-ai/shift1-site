<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SHUFFLE render frame</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <script src="shuffle-engine.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000; overflow: hidden; }
    /* The frame is sized in real output pixels from the hash, so type scales
       with the delivery resolution rather than the browser window. */
    #frame {
      container-type: size; position: relative; background: #000; overflow: hidden;
    }
    .stack { position: absolute; inset: 0; display: grid; place-items: center; }

    .shuffle {
      font-family: 'Inter', sans-serif; font-weight: 200; font-size: 11cqh;
      letter-spacing: 1.85em; white-space: nowrap; line-height: 1; display: flex;
      color: var(--lit);
    }
    .shuffle .ch {
      opacity: var(--o, 0); --bm: 1;
      text-shadow:
        0 0 .038em rgba(var(--glow), calc(.42 * var(--bm) * var(--bt))),
        0 0 .125em rgba(var(--glow), calc(.20 * var(--bm) * var(--bt))),
        0 0 .38em  rgba(var(--glow), calc(.075 * var(--bm) * var(--bt))),
        0 0 .95em  rgba(var(--glow), calc(.024 * var(--bm) * var(--bt)));
    }
    .shuffle .ch:last-child { margin-right: -1.85em; }

    /* Sits in the subtitle slot beneath where SHUFFLE was, not in its place.
       --drop is measured from frame centre in container-height units. */
    .bats {
      font-family: 'Inter', sans-serif; font-weight: 300; font-size: 3.5cqh;
      letter-spacing: .52em; white-space: nowrap; line-height: 1;
      color: var(--bats-lit); opacity: 0;
      transform: translateY(var(--drop, 13cqh));
      text-shadow: 0 0 .022em rgba(var(--bats-glow), .085);  /* essentially none */
    }
    .bats span { margin-right: -.52em; }
  </style>
</head>
<body>
<div id="frame">
  <div class="stack"><div class="shuffle" id="sh"></div></div>
  <div class="stack"><div class="bats" id="bats"></div></div>
</div>
<script>
/* Render harness: #w=2048&h=858&t=1.75&tube=A&bloom=1.00
   or #f=42 to address a frame directly. Sets window.RENDER_READY when the
   requested instant is painted, so the capture script can wait on it. */
const E = window.ShuffleEngine;
const TUBE = { A: '#f2ecc9', B: '#ecedbf', C: '#f5e7b4', D: '#f0f0ea' };

const q = {};
location.hash.slice(1).split('&').forEach(function (kv) {
  if (!kv) return; const a = kv.split('='); q[a[0]] = a[1];
});
const W = parseInt(q.w || 2048, 10), H = parseInt(q.h || 858, 10);
const tubeKey = TUBE[q.tube] ? q.tube : 'A';
const bloom = q.bloom !== undefined ? parseFloat(q.bloom) : 1.0;
const drop = q.drop !== undefined ? parseFloat(q.drop) : 13;
const dim  = q.dim  !== undefined ? parseFloat(q.dim)  : E.BATS_PEAK;
if (q.decay !== undefined) E.SEQ.shuffleOutF = parseInt(q.decay, 10);
const speed = q.speed !== undefined ? parseFloat(q.speed) : 1;
const t = q.f !== undefined ? (parseInt(q.f, 10) / (E.FPS * speed)) : parseFloat(q.t || 0);

const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const rgb2hex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const batsHexFor = h => rgb2hex(hex2rgb(h).map((v, i) => v * 0.72 + [201, 200, 192][i] * 0.28));

const frame = document.getElementById('frame');
frame.style.width = W + 'px';
frame.style.height = H + 'px';
const lit = TUBE[tubeKey], bh = batsHexFor(lit);
frame.style.setProperty('--lit', lit);
frame.style.setProperty('--glow', hex2rgb(lit).join(','));
frame.style.setProperty('--bt', bloom);
frame.style.setProperty('--bats-lit', bh);
frame.style.setProperty('--bats-glow', hex2rgb(bh).join(','));
frame.style.setProperty('--drop', drop + 'cqh');

const sh = document.getElementById('sh'), bats = document.getElementById('bats');
const chars = [];
for (let i = 0; i < E.N; i++) {
  const s = document.createElement('span');
  s.className = 'ch'; s.textContent = E.WORD[i];
  sh.appendChild(s); chars.push(s);
}
const bs = document.createElement('span'); bs.textContent = E.BATS_TEXT; bats.appendChild(bs);

function paint(time) {
  for (let i = 0; i < E.N; i++) {
    const b = E.shuffleAt(time, i);
    const bm = b > 1 ? 1 + (b - 1) * 2.6 : b;
    chars[i].style.setProperty('--o', Math.min(1, b).toFixed(5));
    chars[i].style.setProperty('--bm', Math.max(0, bm).toFixed(5));
  }
  // engine value is normalised to BATS_PEAK; rescale if dim is overridden
  bats.style.opacity = (E.batsAt(time) / E.BATS_PEAK * dim).toFixed(5);
}

paint(t);
window.RENDER_INFO = { w: W, h: H, t: t, frame: Math.round(t * E.FPS), tube: tubeKey,
                       bloom: bloom, drop: drop, dim: dim, decay: E.SEQ.shuffleOutF, speed: speed,
                       lit: lit, batsLit: bh,
                       frames: E.SEQ.frames };
/* only declare ready once webfonts are in, or glyph metrics differ per frame */
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () { paint(t); window.RENDER_READY = true; });
} else { window.RENDER_READY = true; }
</script>
</body>
</html>
