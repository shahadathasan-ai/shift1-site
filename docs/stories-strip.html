<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Shift1 — Stories (strip mockup)</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    /* palette and type lifted straight from index.html so this sits on the
       site without a seam */
    :root{
      --bg:#0b0b0b; --bg-card:#161616; --bg-card-back:#1a1a1a;
      --text:#e8e4de; --text-muted:#8a8580;
      --accent:#e8d5a3; --accent-dim:rgba(201,185,154,.12);
      --font-heading:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
    }
    html{ scroll-behavior:smooth; scroll-snap-type:y mandatory; }
    body{
      background:var(--bg); color:var(--text); font-family:var(--font-body);
      font-weight:300; line-height:1.6; -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    /* ─── BACKGROUND PARTICLES — the fireflies, unchanged ─── */
    .particles{ position:fixed; top:0; left:0; width:100%; height:100%;
      pointer-events:none; z-index:0; overflow:hidden; }
    .particle{ position:absolute; background:var(--accent); border-radius:50%;
      opacity:0; animation:firefly ease-in-out infinite; }
    @keyframes firefly{
      0%   { opacity:0;   transform:translate(0,0); }
      25%  { opacity:.4; }
      50%  { opacity:.15; transform:translate(30px,-60px); }
      75%  { opacity:.32; }
      100% { opacity:0;   transform:translate(-20px,-120px); }
    }

    /* ─── NAV ─── */
    nav{ position:fixed; top:0; width:100%; padding:1.5rem 3rem; display:flex;
      justify-content:space-between; align-items:center; z-index:100;
      background:linear-gradient(to bottom,var(--bg) 60%,transparent); }
    .nav-logo{ font-family:var(--font-heading); font-size:1rem; font-weight:600;
      letter-spacing:.15em; color:var(--text); text-decoration:none; }
    .nav-links{ display:flex; gap:2.5rem; list-style:none; }
    .nav-links a{ font-size:.8rem; letter-spacing:.1em; text-transform:uppercase;
      color:var(--text-muted); text-decoration:none; transition:color .3s; }
    .nav-links a:hover{ color:var(--text); }

    /* ─── HERO ─── */
    .hero{ height:100dvh; display:flex; flex-direction:column; justify-content:center;
      align-items:center; position:relative; z-index:1; scroll-snap-align:start; }
    .hero-logo{ margin-bottom:2rem; }
    .logo-text{ font-family:var(--font-heading); font-size:clamp(4rem,10vw,8rem);
      font-weight:700; letter-spacing:.08em; color:var(--text); line-height:1; }
    .logo-text .one{ color:var(--accent); }
    .hero-sub{ font-size:.85rem; letter-spacing:.35em; text-transform:uppercase;
      color:var(--text-muted); margin-top:.75rem; text-align:center; text-indent:.35em; }
    .hero-line{ width:40px; height:1px; background:var(--accent); margin-top:3rem; opacity:.5; }
    .scroll-hint{ position:absolute; bottom:8rem; display:flex; flex-direction:column;
      align-items:center; gap:.4rem; color:var(--accent); text-decoration:none;
      animation:bounce 2s ease-in-out infinite; cursor:pointer; transition:opacity .3s; }
    .scroll-hint:hover{ opacity:.7; }
    .scroll-label{ font-size:.65rem; letter-spacing:.2em; text-transform:uppercase; }
    @keyframes bounce{ 0%,100%{opacity:.8;transform:translateY(0)} 50%{opacity:1;transform:translateY(8px)} }

    /* ─── STORIES ─── */
    #stories{ height:100dvh; position:relative; z-index:1; scroll-snap-align:start;
      display:flex; flex-direction:column; justify-content:center; overflow:hidden; }

    .strip-head{ position:absolute; top:6.5rem; left:3rem; right:3rem; z-index:3;
      display:flex; align-items:baseline; gap:1.25rem; }
    .section-label{ font-family:var(--font-heading); font-size:.7rem; letter-spacing:.25em;
      text-transform:uppercase; color:var(--accent); opacity:.85; }
    .section-title{ font-family:var(--font-heading); font-size:1.6rem; font-weight:600;
      letter-spacing:-.01em; }
    .section-text{ font-size:.85rem; color:var(--text-muted); margin-left:auto; }

    /* the film itself */
    .gate{ position:relative; width:100%; }
    #film{ will-change:transform; }                 /* scroll drives this one   */
    #reel{ animation:reel 15s ease-in-out infinite; } /* and this one idles      */
    @keyframes reel{ 0%,100%{transform:translateX(-10px)} 50%{transform:translateX(10px)} }

    .band{ position:absolute; left:-8%; right:-8%; background:#0f0f0f;
      border-top:1px solid #1e1e1e; border-bottom:1px solid #1e1e1e; }
    .rail{ position:absolute; left:-8%; right:-8%; height:15px;
      background:repeating-linear-gradient(90deg,transparent 0 13px,#1d1d1d 13px 26px);
      animation:perf 6s linear infinite; }
    @keyframes perf{ to{ background-position:-26px 0 } }

    /* laid out from the left with a measured offset.  justify-content:center
       does not centre reliably once the row is wider than the window — it was
       pushing the last frame off the right edge. */
    .film-row{ position:relative; display:flex; gap:13px; justify-content:flex-start;
      align-items:center; padding:22px 0; width:max-content; }

    /* a blank frame at each end, so the film runs off the edges of the screen */
    .leader{ flex:0 0 auto; border:1px solid #1a1a1a; border-radius:3px;
      background:#0d0d0d; opacity:.6; }

    .frame{ flex:0 0 auto; perspective:1400px; opacity:0; transform:translateX(60px) scale(.96);
      transition:opacity .6s ease, transform .8s cubic-bezier(.16,.84,.34,1); }
    .frame.in{ opacity:1; transform:none; }

    .flipper{ position:relative; width:100%; height:100%; transform-style:preserve-3d;
      transition:transform .75s cubic-bezier(.4,.1,.2,1); }
    /* only the four stories that have something on the back pivot —
       exactly which cards flip on the homepage today */
    .frame.can-flip:hover .flipper,
    .frame.can-flip.on  .flipper{ transform:rotateY(180deg); }

    .face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
      background:var(--bg-card); border:1px solid #232323; border-radius:3px; overflow:hidden;
      display:flex; flex-direction:column; text-decoration:none; color:inherit;
      transition:border-color .3s, box-shadow .3s; }
    .frame:hover .face{ border-color:var(--accent-dim); box-shadow:0 16px 46px rgba(0,0,0,.7); }
    .back{ transform:rotateY(180deg); background:var(--bg-card-back); padding:20px 18px;
      justify-content:center; }

    .art{ position:relative; height:52%; flex:0 0 52%; background:#161616; overflow:hidden; }
    .art img{ width:100%; height:100%; object-fit:cover; display:block; }
    .art.logo{ display:flex; align-items:center; justify-content:center; }
    .art.logo img{ width:56%; height:auto; object-fit:contain;
      filter:invert(1) sepia(1) saturate(3.6) hue-rotate(4deg) brightness(.95); }
    /* nothing is ever stood in for — a story with no art says so */
    .art.none{ background:repeating-linear-gradient(135deg,#141414 0 9px,#181818 9px 18px); }
    .art.none::after{ content:'NO ARTWORK YET'; position:absolute; top:8px; right:9px;
      font-family:var(--font-heading); font-size:7px; letter-spacing:.16em; color:#3c3a37; }

    .cap{ flex:1; padding:13px 13px 12px; display:flex; flex-direction:column;
      justify-content:flex-start; }
    .cap::after{ content:''; display:block; width:26px; height:1px; margin-top:auto;
      background:var(--accent); opacity:.45; }
    .card-category{ font-family:var(--font-heading); font-size:.6rem; letter-spacing:.2em;
      text-transform:uppercase; color:var(--accent); opacity:.85; }
    .card-title{ font-family:var(--font-heading); font-size:1rem; font-weight:600;
      letter-spacing:-.01em; margin-top:3px; }
    .card-subtitle{ font-size:.72rem; color:var(--text-muted); margin-top:1px; }
    .card-back-title{ font-family:var(--font-heading); font-size:1.05rem; font-weight:600; }
    .card-back-text{ font-size:.75rem; line-height:1.55; color:var(--text-muted); margin-top:.6rem; }
    .card-back-link{ font-size:.7rem; letter-spacing:.08em; color:var(--accent); margin-top:1rem; }

    .strip-foot{ position:absolute; bottom:3.2rem; left:0; right:0; text-align:center;
      font-size:.65rem; letter-spacing:.2em; text-transform:uppercase; color:var(--text-muted);
      opacity:.55; }

    @media (max-width:900px){
      nav{ padding:1.2rem 1.4rem }
      .strip-head{ left:1.4rem; right:1.4rem; top:5.5rem; flex-direction:column; gap:.2rem }
      .section-text{ margin-left:0 }
      #stories{ overflow-x:auto; scrollbar-width:none }
      .film-row{ justify-content:flex-start; padding-left:1.4rem }
      .strip-head{ top:5rem }
      .strip-foot{ bottom:2rem }
    }
  </style>
</head>
<body>

  <!-- BACKGROUND PARTICLES -->
  <div class="particles" id="particles"></div>

  <!-- NAV -->
  <nav>
    <a href="#" class="nav-logo">SH1FT</a>
    <ul class="nav-links">
      <li><a href="#stories">Stories</a></li>
      <li><a href="#stories">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-logo">
      <div class="logo-text">SH<span class="one">1</span>FT</div>
      <div class="hero-sub">Studios</div>
    </div>
    <div class="hero-line"></div>
    <a href="#stories" class="scroll-hint"><span class="scroll-label">Stories</span>&#8595;</a>
  </section>

  <!-- STORIES -->
  <section id="stories">
    <div class="strip-head">
      <div class="section-label">Stories</div>
      <h2 class="section-title">Selected Stories</h2>
      <p class="section-text">Features, pilots, novels, short stories — the best fit for the idea.</p>
    </div>

    <div class="gate">
      <div id="film">
        <div id="reel">
          <div class="band" id="band"></div>
          <div class="rail" id="railTop"></div>
          <div class="rail" id="railBot"></div>
          <div class="film-row" id="row"></div>
        </div>
      </div>
    </div>

    <div class="strip-foot" id="foot">Hover a frame to turn it over</div>
  </section>

<script>
/* the seven stories — artwork and copy are the site's own */
const F = 'read/frames/';
const STORIES = [
  { t:'NYC Midnight', k:'Competition', g:'Short story competition',
    img:F+'nyc-logo.webp', logo:true, href:'nyc-midnight.html',
    backTitle:'4 Competitions',
    back:'Scary Story Challenge — 2025<br>Screenwriting Challenge — 2025<br>Screenwriting Challenge — 2026<br>Short Story Challenge — 2026',
    link:'View entries &rarr;' },
  { t:'Shuffle', k:'Short Film', g:'Horror',
    img:F+'shuffle-tile-v2.png', href:'shuffle.html',
    backTitle:'Shuffle',
    back:'Some night shifts are quieter than others. For one laboratory worker, the silence is only the beginning. Based on a true story.',
    link:'See short video &rarr;' },
  { t:'Icarus', k:'Animated Pilot', g:'Comedy / Sci-Fi',
    img:F+'icarus.jpg', href:'read/icarus.html',
    backTitle:'Icarus',
    back:"An outcast teenager becomes the unlikely leader of an alien universe on the brink of collapse. She didn't ask for the job — and they didn't ask for her.",
    link:'Read the script &rarr;' },
  { t:'Lion Street', k:'Novel', g:'Biopic', img:null,
    backTitle:'Lion Street',
    back:'A teenage girl arrives in a foreign country barely speaking the language. She finds a close community of others like her, and together they make their way in a new world.' },
  { t:'Bombshell',         k:'Feature Screenplay', g:'Comedy',          img:null },
  { t:'God has No Family', k:'Feature Screenplay', g:'Thriller / Sci-Fi', img:null },
  { t:'Nostradamus',       k:'Feature Screenplay', g:'Romantic Comedy', img:null },
];

/* ── size the film to the window: seven frames across, full height used ── */
const row = document.getElementById('row');
function art(s){
  if(!s.img) return '<div class="art none"></div>';
  if(s.logo) return `<div class="art logo"><img src="${s.img}" alt="${s.t}"></div>`;
  return `<div class="art"><img src="${s.img}" alt="${s.t}"></div>`;
}
function layout(){
  /* clientWidth, not innerWidth — innerWidth counts the scrollbar, which made
     the film ~15px too wide and pushed the last frame off the edge */
  const W = document.documentElement.clientWidth,
        H = document.documentElement.clientHeight, g = 13;
  /* the second cap keeps the outermost real frame clear of the window edge
     once the blank leaders are added on either side */
  /* narrow screens can't hold seven frames, so the film runs off to the right
     and you scroll it sideways — which is what a strip should do anyway */
  const narrow = W < 900;
  const tw = narrow ? Math.min(W*0.62, 240)
                    : Math.min((W - 8*g)/7, (W/2 - 3*g - 12)/3.5, 268);
  const th = Math.min(tw*1.95, H - (narrow ? 260 : 330));
  const lead = tw*(narrow ? 0.12 : 0.7);   /* barely any leader on a phone */
  const total = 2*lead + 7*tw + 8*g;

  row.innerHTML =
    `<div class="leader" style="width:${lead}px;height:${th}px"></div>` +
    STORIES.map((s,i)=>{
      const flip = !!s.back;
      const tag  = s.href ? 'a' : 'div';
      const href = s.href ? ` href="${s.href}"` : '';
      return `<article class="frame${flip?' can-flip':''}" data-i="${i}"
                style="width:${tw}px;height:${th}px;transition-delay:${i*70}ms">
        <div class="flipper">
          <${tag}${href} class="face front">
            ${art(s)}
            <div class="cap">
              <div class="card-category">${s.k}</div>
              <div class="card-title">${s.t}</div>
              <div class="card-subtitle">${s.g}</div>
            </div>
          </${tag}>
          ${flip ? `<${tag}${href} class="face back">
            <div class="card-category">${s.k}</div>
            <div class="card-back-title">${s.backTitle}</div>
            <div class="card-back-text">${s.back}</div>
            ${s.link ? `<div class="card-back-link">${s.link}</div>` : ''}
          </${tag}>` : ''}
        </div>
      </article>`;
    }).join('') +
    `<div class="leader" style="width:${lead}px;height:${th}px"></div>`;

  row.style.marginLeft = narrow ? '0px' : ((W - total)/2)+'px';  /* negative: runs off both edges */

  /* rails and backing sit against the film, not the window */
  const band = document.getElementById('band');
  const h = th + 44;
  band.style.top = '0px'; band.style.height = h+'px';
  document.getElementById('railTop').style.top = '0px';
  document.getElementById('railBot').style.top = (h-15)+'px';
  document.querySelector('.film-row').style.paddingTop = '22px';
}
layout();
let rt; addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(layout, 180); });

/* ── motion 1: the frames thread in one after another the first time you
      arrive, the same way the homepage cards reveal on scroll ── */
const sect = document.getElementById('stories');
let threaded = false;
function thread(){
  if(threaded) return;
  threaded = true;
  row.querySelectorAll('.frame').forEach(f=>f.classList.add('in'));
}
new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting) thread(); });
}, { threshold:.25 }).observe(sect);

/* ── motion 2: the film runs sideways as you come down the page, then
      settles.  A timeout rather than rAF chains, so it can't be starved. ── */
const film = document.getElementById('film');
function run(){
  const top = sect.getBoundingClientRect().top;
  const p = Math.min(1, Math.max(0, 1 - top/Math.max(1, innerHeight)));
  film.style.transform = `translateX(${(1-p)*16}vw)`;
  /* the observer is the nice way in; this is the belt and braces, so the
     frames can never stay invisible if it doesn't fire */
  if(sect.getBoundingClientRect().top < innerHeight*0.75) thread();
}
addEventListener('scroll', run, { passive:true });
run();

/* say the right thing for the device you're actually on */
if(matchMedia('(hover:none)').matches)
  document.getElementById('foot').textContent = 'Swipe the film · tap a frame to turn it over';

/* tap to turn a card over on touch, where there is no hover */
row.addEventListener('click', e=>{
  const f = e.target.closest('.frame.can-flip');
  if(f && matchMedia('(hover:none)').matches){ e.preventDefault(); f.classList.toggle('on'); }
});

/* ── the fireflies, same count and behaviour as index.html ── */
const container = document.getElementById('particles');
for(let i=0;i<40;i++){
  const p = document.createElement('div');
  p.classList.add('particle');
  p.style.left = Math.random()*100 + '%';
  p.style.top  = Math.random()*100 + '%';
  const size = 2 + Math.random()*2;
  p.style.width = size+'px'; p.style.height = size+'px';
  p.style.animationDuration = (8 + Math.random()*8) + 's';
  p.style.animationDelay = (Math.random()*1) + 's';
  container.appendChild(p);
}
</script>
</body>
</html>
