<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shift1 — Studios</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    /* palette, type and card system lifted from index.html unchanged */
    :root{
      --bg:#0b0b0b; --bg-card:#161616; --bg-card-back:#1a1a1a;
      --text:#e8e4de; --text-muted:#8a8580;
      --accent:#e8d5a3; --accent-dim:rgba(201,185,154,.12);
      --font-heading:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
    }
    html,body{ height:100%; overflow:hidden; }
    body{ background:var(--bg); color:var(--text); font-family:var(--font-body);
      font-weight:300; line-height:1.6; -webkit-font-smoothing:antialiased; }

    /* ─── fireflies, as on the live site ─── */
    .particles{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .particle{ position:absolute; background:var(--accent); border-radius:50%; opacity:0;
      animation:firefly ease-in-out infinite; }
    @keyframes firefly{
      0%{opacity:0;transform:translate(0,0)} 25%{opacity:.4}
      50%{opacity:.15;transform:translate(30px,-60px)} 75%{opacity:.32}
      100%{opacity:0;transform:translate(-20px,-120px)}
    }

    nav{ position:fixed; top:0; width:100%; padding:1.5rem 3rem; display:flex;
      justify-content:space-between; align-items:center; z-index:100;
      background:linear-gradient(to bottom,var(--bg) 60%,transparent); }
    .nav-logo{ font-family:var(--font-heading); font-size:1rem; font-weight:600;
      letter-spacing:.15em; color:var(--text); text-decoration:none; }
    .nav-links{ display:flex; gap:2.5rem; list-style:none; }
    .nav-links a{ font-size:.8rem; letter-spacing:.1em; text-transform:uppercase;
      color:var(--text-muted); text-decoration:none; transition:color .3s; }
    .nav-links a:hover{ color:var(--text); }

    /* the whole page is one screen: heading, then the six, nothing below */
    section{ position:relative; z-index:1; height:100%; max-width:1500px; margin:0 auto;
      padding:5.5rem 3rem 3rem; display:flex; flex-direction:column; }
    /* the one heading, set exactly as the old PROJECTS label was */
    .section-label{ font-size:.7rem; letter-spacing:.25em; text-transform:uppercase;
      color:var(--accent); margin-bottom:1.6rem; flex:0 0 auto; }

    /* ─── the card grid — three across, two down, exactly even ─── */
    .projects-grid{
      flex:1; min-height:0;
      display:grid;
      grid-template-columns:repeat(3,1fr);   /* fixed 3, so it is always symmetrical */
      grid-template-rows:repeat(2,1fr);      /* and the two rows share what is left */
      gap:2rem;
    }
    .card-container{ perspective:1000px; height:100%; min-height:0; }
    .card-container a{ text-decoration:none; color:inherit; display:block; width:100%; height:100%; }
    .card{ width:100%; height:100%; position:relative; transform-style:preserve-3d;
      transition:transform .7s cubic-bezier(.4,0,.2,1); cursor:pointer; }
    /* every card turns now — there is no no-flip variant */
    .card-container:hover .card, .card-container.on .card{ transform:rotateY(180deg); }

    .card-front,.card-back{ position:absolute; width:100%; height:100%;
      backface-visibility:hidden; -webkit-backface-visibility:hidden;
      border-radius:8px; overflow:hidden; }

    .card-front{ background:var(--bg-card); border:1px solid rgba(255,255,255,.04);
      transition:border-color .3s ease; padding:0; --imgh:62%; }
    .card-container:hover .card-front{ border-color:rgba(201,185,154,.15); }

    .tile-bg{ position:absolute; left:0; right:0; top:0; height:var(--imgh); z-index:0;
      overflow:hidden; background:#141414; }
    .tile-bg img{ width:100%; height:100%; object-fit:cover; display:block; }
    .edge{ position:absolute; left:0; right:0; height:60px; top:calc(var(--imgh) - 60px);
      z-index:2; background:linear-gradient(to bottom,transparent,rgba(11,11,11,.4)); }
    .tile-panel{ position:absolute; left:0; right:0; top:var(--imgh); bottom:0; z-index:4;
      background:var(--bg-card); border-top:1px solid rgba(232,213,163,.14);
      padding:clamp(.85rem,2vh,1.5rem) 2rem clamp(.8rem,1.9vh,1.4rem);
      display:flex; flex-direction:column; justify-content:flex-end; }

    .card-category{ font-size:.65rem; letter-spacing:.25em; text-transform:uppercase;
      color:var(--accent); margin-bottom:clamp(.35rem,.9vh,.75rem); font-weight:500; }
    .card-title{ font-family:var(--font-heading); font-size:clamp(1.05rem,2.4vh,1.5rem);
      font-weight:600; color:var(--text); margin-bottom:clamp(.2rem,.6vh,.5rem); line-height:1.2; }
    .card-subtitle{ font-size:clamp(.74rem,1.5vh,.85rem); color:var(--text-muted); }

    .card-back{ background:var(--bg-card-back); transform:rotateY(180deg);
      padding:clamp(1.1rem,2.6vh,2rem);
      display:flex; flex-direction:column; justify-content:center;
      border:1px solid rgba(201,185,154,.1); border-radius:8px; }
    .card-back .card-category{ margin-bottom:clamp(.4rem,1vh,1rem); }
    .card-back-title{ font-family:var(--font-heading); font-size:clamp(1rem,2vh,1.2rem);
      font-weight:600; color:var(--text); margin-bottom:clamp(.45rem,1.1vh,1rem); }
    .card-back-text{ font-size:clamp(.73rem,1.45vh,.9rem); color:var(--text-muted);
      line-height:1.58; margin-bottom:clamp(.7rem,1.6vh,1.5rem); }
    .card-back-link{ display:inline-block; align-self:flex-start; font-size:.7rem;
      letter-spacing:.15em; text-transform:uppercase; color:var(--accent);
      text-decoration:none; transition:opacity .3s;
      border-bottom:1px solid rgba(201,185,154,.3); padding-bottom:2px; }
    .card-back-link:hover{ opacity:.7; }
    /* an honest gap, not invented copy */
    .card-back-todo{ font-size:.8rem; color:#57534e; font-style:italic; }

    /* cards come up as they enter, the way the live site reveals them */
    .reveal{ opacity:0; transform:translateY(22px);
      transition:opacity .7s ease, transform .8s cubic-bezier(.19,.82,.28,1);
      transition-delay:calc(var(--i) * 90ms); }
    .reveal.visible{ opacity:1; transform:none; }

    @media (max-width:1150px){ .projects-grid{ grid-template-columns:repeat(2,1fr) } }
    /* a phone cannot hold six cards in one screen, so there it scrolls */
    @media (max-width:760px){
      html,body{ overflow:auto }
      section{ height:auto; padding:5rem 1.4rem 3rem }
      nav{ padding:1.2rem 1.4rem }
      .projects-grid{ grid-template-columns:1fr; grid-template-rows:none }
      .card-container{ height:360px }
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <nav>
    <a href="#" class="nav-logo">SH1FT</a>
    <ul class="nav-links">
      <li><a href="#projects">Stories</a></li>
      <li><a href="mailto:stories@shift1.co">Contact</a></li>
    </ul>
  </nav>

  <section id="projects">
    <div class="section-label">Stories</div>
    <div class="projects-grid" id="grid"></div>
  </section>

<script>
const F = 'read/frames/';
/* Six stories, every one with its own artwork.  Copy is only what already
   exists on the site — nothing here is invented. */
const S = [
  { t:'Shuffle', k:'Feature', g:'Horror', img:F+'shuffle-tile.jpg', href:'shuffle.html',
    back:'Some night shifts are quieter than others. For one laboratory worker, the silence is only the beginning. Based on a true story.',
    link:'See short video &rarr;' },
  { t:'Icarus', k:'Animated Pilot', g:'Sci-Fi', img:F+'icarus.jpg', href:'read/icarus.html',
    back:"An outcast teenager becomes the unlikely leader of an alien universe on the brink of collapse. She didn't ask for the job — and they didn't ask for her.",
    link:'Read the script &rarr;' },
  { t:'Lyon Street', k:'Novel', g:'Biopic', img:F+'lyon-street.jpg',
    back:'A teenage girl arrives in a foreign country barely speaking the language. She finds a close community of others like her, and together they make their way in a new world.' },
  { t:'Bombshell', k:'Feature Screenplay', g:'Comedy', img:F+'bombshell.jpg' },
  { t:'God has No Family', k:'Feature Screenplay', g:'Thriller / Sci-Fi', img:F+'god-has-no-family.jpg' },
  { t:'Nostradamus', k:'Feature Screenplay', g:'Romantic Comedy', img:F+'nostradamus.jpg' },
];

document.getElementById('grid').innerHTML = S.map((s,i)=>{
  const tag  = s.href ? 'a' : 'div';
  const href = s.href ? ` href="${s.href}"` : '';
  return `<div class="card-container reveal" data-i="${i}" style="--i:${i}">
    <div class="card">
      <${tag}${href} class="card-front">
        <div class="tile-bg"><img src="${s.img}" alt="${s.t}"></div>
        <div class="edge"></div>
        <div class="tile-panel">
          <div class="card-category">${s.k}</div>
          <div class="card-title">${s.t}</div>
          <div class="card-subtitle">${s.g}</div>
        </div>
      </${tag}>
      <${tag}${href} class="card-back">
        <div class="card-category">${s.k}</div>
        <div class="card-back-title">${s.t}</div>
        ${s.back
          ? `<div class="card-back-text">${s.back}</div>`
          : `<div class="card-back-text card-back-todo">Synopsis to come.</div>`}
        ${s.link ? `<span class="card-back-link">${s.link}</span>` : ''}
      </${tag}>
    </div>
  </div>`;
}).join('');

/* the page no longer scrolls, so the cards simply come up on load.
   A timeout, not requestAnimationFrame — rAF can be starved and then the
   reveal never fires at all. */
const cards = document.querySelectorAll('.reveal');
setTimeout(()=>cards.forEach(c=>c.classList.add('visible')), 60);

/* tap to turn a card over where there is no hover */
if(matchMedia('(hover:none)').matches){
  document.getElementById('grid').addEventListener('click', e=>{
    const c = e.target.closest('.card-container');
    if(c){ e.preventDefault(); c.classList.toggle('on'); }
  });
}

/* fireflies */
const container = document.getElementById('particles');
for(let i=0;i<40;i++){
  const p = document.createElement('div');
  p.classList.add('particle');
  p.style.left = Math.random()*100+'%'; p.style.top = Math.random()*100+'%';
  const size = 2 + Math.random()*2;
  p.style.width = size+'px'; p.style.height = size+'px';
  p.style.animationDuration = (8+Math.random()*8)+'s';
  p.style.animationDelay = (Math.random()*1)+'s';
  container.appendChild(p);
}
</script>

<script data-goatcounter="https://shift1.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
