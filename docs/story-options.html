<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Shift1 — Stories page options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0b0b0b; --panel:#131313; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.17);
    --text:#e8e4de; --dim:#8a8580; --faint:#5e5a55; --gold:#e8d5a3;
    --fh:'Space Grotesk',sans-serif; --fb:'Inter',sans-serif; --fm:'JetBrains Mono',monospace;
    --bar:74px;
  }
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--text);font-family:var(--fb);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}

  /* ─── the bar (chrome, not part of the design) ─── */
  .bar{height:var(--bar);display:flex;align-items:center;gap:22px;padding:0 clamp(24px,3vw,44px);
       border-bottom:1px solid var(--line);position:relative;z-index:20}
  .bar .who{font-family:var(--fm);font-size:10px;letter-spacing:.24em;color:var(--faint);white-space:nowrap}
  .tabs{display:flex;gap:2px;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
  .tabs button{padding:7px 16px;font-size:12px;letter-spacing:.05em;color:var(--dim);transition:.15s;white-space:nowrap}
  .tabs button+button{border-left:1px solid var(--line)}
  .tabs button:hover{color:var(--text)}
  .tabs button.on{background:var(--gold);color:#0b0b0b;font-weight:500}
  .bar .desc{font-size:12px;color:var(--faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
  .ghost{border:1px solid var(--line2);border-radius:3px;padding:6px 12px;font-size:11.5px;color:var(--dim);transition:.15s}
  .ghost:hover{border-color:var(--gold);color:var(--gold)}

  /* ─── stage ─── */
  .stage{height:calc(100vh - var(--bar));position:relative;overflow:hidden}
  .view{position:absolute;inset:0;padding:clamp(20px,2.6vh,34px) clamp(24px,3vw,44px);display:none}
  .view.on{display:block}

  /* a plate for stories with no artwork yet — type, not a fake image */
  .plate{position:relative;width:100%;height:100%;background:
      linear-gradient(150deg,#141414 0%,#0f0f0f 60%,#0c0c0c 100%);
      display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .plate::before{content:'';position:absolute;inset:0;
      background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.014) 22px 44px)}
  .plate .no{position:absolute;top:14px;right:16px;font-family:var(--fm);font-size:9px;
      letter-spacing:.16em;color:var(--faint);opacity:.75}

  /* ══ A · GRID ═══════════════════════════════════════════════════════ */
  .a-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);
          gap:clamp(10px,1.1vw,16px);height:100%}
  .a-tile{position:relative;overflow:hidden;cursor:pointer;background:#000;
          clip-path:inset(100% 0 0 0);transition:clip-path .9s cubic-bezier(.16,1,.3,1)}
  .a-tile.in{clip-path:inset(0 0 0 0)}
  .a-tile img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);
              transition:transform 1.1s cubic-bezier(.16,1,.3,1),filter .45s;filter:grayscale(.5) brightness(.6)}
  .a-tile.in img{transform:scale(1)}
  .a-tile:hover img{filter:grayscale(0) brightness(.82);transform:scale(1.05)}
  .a-tile .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 15px;z-index:2;
               background:linear-gradient(transparent,rgba(6,6,6,.92))}
  .a-tile .k{font-family:var(--fm);font-size:9px;letter-spacing:.2em;color:var(--gold);margin-bottom:5px;
             opacity:0;transform:translateY(8px);transition:.5s}
  .a-tile .t{font-family:var(--fh);font-weight:600;font-size:clamp(15px,1.35vw,20px);letter-spacing:-.01em;
             opacity:0;transform:translateY(12px);transition:.5s}
  .a-tile .g{font-size:11px;color:var(--dim);margin-top:2px;opacity:0;transform:translateY(12px);transition:.5s}
  .a-tile.in .k,.a-tile.in .t,.a-tile.in .g{opacity:1;transform:none}
  .a-tile .plate .cap{background:none;position:relative}

  /* ══ B · COLLAGE ════════════════════════════════════════════════════ */
  .b-grid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(10,1fr);
          gap:clamp(10px,1.1vw,16px);height:100%}
  .b-item{position:relative;cursor:pointer;display:flex;flex-direction:column;min-height:0;
          opacity:0;transform:translateY(34px);
          transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
  .b-item.in{opacity:1;transform:none}
  .b-item .ph{position:relative;overflow:hidden;background:#000;flex:1;min-height:0}
  .b-item .ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(.55) brightness(.6);
                  transition:transform .9s cubic-bezier(.16,1,.3,1),filter .45s}
  .b-item:hover .ph img{transform:scale(1.06);filter:grayscale(0) brightness(.8)}
  .b-item .meta{display:flex;align-items:baseline;gap:9px;margin-top:9px;flex:none}
  .b-item .num{font-family:var(--fm);font-size:9.5px;color:var(--faint)}
  .b-item .t{font-family:var(--fh);font-weight:600;font-size:clamp(13px,1.1vw,16px)}
  .b-item .g{font-size:11px;color:var(--dim);margin-left:auto}
  .b-item .ln{height:1px;background:var(--line);margin-top:8px;flex:none;transform:scaleX(0);transform-origin:left;
              transition:transform .5s cubic-bezier(.16,1,.3,1)}
  .b-item:hover .ln{transform:scaleX(1);background:var(--gold)}

  /* ══ C · INDEX ══════════════════════════════════════════════════════ */
  .c-list{height:100%;display:flex;flex-direction:column;justify-content:center}
  .c-row{display:flex;align-items:baseline;gap:18px;padding:clamp(9px,1.5vh,18px) 2px;
         border-bottom:1px solid var(--line);cursor:pointer;position:relative;
         opacity:0;transform:translateY(22px);
         transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
  .c-row.in{opacity:1;transform:none}
  .c-row .num{font-family:var(--fm);font-size:11px;color:var(--faint);width:28px;flex:none}
  .c-row .t{font-family:var(--fh);font-weight:600;font-size:clamp(22px,3vw,42px);letter-spacing:-.025em;
            transition:transform .45s cubic-bezier(.16,1,.3,1),color .3s;transform-origin:left}
  .c-row .g{margin-left:auto;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);transition:color .3s}
  .c-row .art{font-family:var(--fm);font-size:9px;letter-spacing:.14em;color:var(--faint);
              border:1px solid var(--line);border-radius:2px;padding:1px 6px;flex:none}
  .c-row:hover .t{transform:translateX(16px);color:var(--gold)}
  .c-row:hover .g{color:var(--dim)}
  .c-row .bar2{position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:var(--gold);
               transform:scaleX(0);transform-origin:left;transition:transform .55s cubic-bezier(.16,1,.3,1)}
  .c-row:hover .bar2{transform:scaleX(1)}
  .c-peek{position:fixed;width:270px;aspect-ratio:16/10;pointer-events:none;z-index:60;overflow:hidden;
          opacity:0;transform:translate(-50%,-50%) scale(.92);transition:opacity .3s,transform .5s cubic-bezier(.16,1,.3,1)}
  .c-peek.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .c-peek img{width:100%;height:100%;object-fit:cover;filter:brightness(.85)}

  /* ─── shared open states ─── */
  .open{position:fixed;inset:0;z-index:90;background:var(--bg);display:none}
  .open.on{display:block}
  .open .art{position:absolute;inset:0;overflow:hidden}
  .open .art img{width:100%;height:100%;object-fit:cover;filter:brightness(.4)}
  .open .art .plate{filter:none}
  .wipe .art{clip-path:inset(0 0 100% 0);animation:wipeDown .85s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes wipeDown{to{clip-path:inset(0 0 0 0)}}
  .bars{position:absolute;inset:0;z-index:2;pointer-events:none}
  .bars i{position:absolute;top:0;bottom:0;width:25.2%;background:var(--bg);
          animation:openBar .82s cubic-bezier(.76,0,.24,1) forwards}
  .bars i:nth-child(1){left:0}.bars i:nth-child(2){left:25%;animation-delay:.06s}
  .bars i:nth-child(3){left:50%;animation-delay:.12s}.bars i:nth-child(4){left:74.8%;animation-delay:.18s}
  @keyframes openBar{to{transform:translateY(-101%)}}
  .open .copy{position:absolute;left:clamp(28px,5vw,80px);bottom:12vh;max-width:620px;z-index:3}
  .open.centre .copy{left:0;right:0;bottom:0;top:0;max-width:none;display:grid;place-items:center;text-align:center;padding:40px}
  .open .copy .in>*,.open .copy>*{animation:up .75s cubic-bezier(.16,1,.3,1) backwards}
  .open .copy .in>*:nth-child(1),.open .copy>*:nth-child(1){animation-delay:.5s}
  .open .copy .in>*:nth-child(2),.open .copy>*:nth-child(2){animation-delay:.58s}
  .open .copy .in>*:nth-child(3),.open .copy>*:nth-child(3){animation-delay:.66s}
  .open .copy .in>*:nth-child(4),.open .copy>*:nth-child(4){animation-delay:.74s}
  @keyframes up{from{opacity:0;transform:translateY(20px)}}
  .open .k{font-family:var(--fm);font-size:11px;letter-spacing:.24em;color:var(--gold);margin-bottom:14px}
  .open h3{font-family:var(--fh);font-weight:600;font-size:clamp(36px,5.4vw,72px);line-height:1;letter-spacing:-.03em;margin-bottom:16px}
  .open .syn{color:rgba(232,228,222,.8);font-size:15px;line-height:1.75;max-width:52ch;margin-bottom:24px}
  .open.centre .syn{margin-left:auto;margin-right:auto}
  .act{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--gold);color:var(--gold);
       border-radius:3px;padding:11px 20px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;transition:.2s}
  .act:hover{background:var(--gold);color:#0b0b0b}
  .closeX{position:absolute;top:24px;right:28px;z-index:5;width:38px;height:38px;border:1px solid var(--line2);
          border-radius:50%;display:grid;place-items:center;transition:.18s;background:rgba(11,11,11,.5)}
  .closeX:hover{border-color:var(--gold);color:var(--gold)}

  /* slide-in panel (B) */
  .side{position:fixed;top:0;right:0;bottom:0;width:min(620px,92vw);z-index:92;background:var(--panel);
        border-left:1px solid var(--line2);transform:translateX(100%);
        transition:transform .6s cubic-bezier(.62,.02,.28,1);overflow-y:auto;box-shadow:-40px 0 90px rgba(0,0,0,.6)}
  .side.on{transform:none}
  .scrim{position:fixed;inset:0;z-index:91;background:rgba(6,6,6,.72);opacity:0;pointer-events:none;transition:opacity .4s}
  .scrim.on{opacity:1;pointer-events:auto}
  .side .hero{aspect-ratio:16/9;overflow:hidden;background:#000;position:relative}
  .side .hero img{width:100%;height:100%;object-fit:cover;filter:brightness(.72)}
  .side .inner{padding:28px 34px 44px}
  .side .k{font-family:var(--fm);font-size:10.5px;letter-spacing:.22em;color:var(--gold)}
  .side h3{font-family:var(--fh);font-weight:600;font-size:32px;letter-spacing:-.02em;margin:10px 0 14px}
  .side .syn{color:rgba(232,228,222,.78);font-size:14px;line-height:1.8;margin-bottom:20px}
  .pill{border:1px solid var(--line2);border-radius:2px;padding:3px 9px;font-size:10.5px;
        letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-right:8px}

  /* replay must not animate backwards — kill transitions while resetting */
  .resetting,.resetting *{transition:none!important;animation:none!important}

  @media(max-width:1000px){
    .a-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr)}
    .b-grid{grid-template-columns:repeat(6,1fr)}
    .c-peek{display:none}
  }
</style>
</head>
<body>

<div class="bar">
  <span class="who">SHIFT1 · STORIES</span>
  <div class="tabs" id="tabs">
    <button data-v="a" class="on">A · Grid</button>
    <button data-v="b">B · Collage</button>
    <button data-v="c">C · Index</button>
  </div>
  <span class="desc" id="desc"></span>
  <span class="right">
    <button class="ghost" id="replay">Replay reveal</button>
  </span>
</div>

<div class="stage">
  <div class="view on" id="va"><div class="a-grid" id="aGrid"></div></div>
  <div class="view"    id="vb"><div class="b-grid" id="bGrid"></div></div>
  <div class="view"    id="vc"><div class="c-list" id="cList"></div></div>
</div>

<div class="open" id="openFull"></div>
<div class="scrim" id="scrim"></div>
<aside class="side" id="side"></aside>
<div class="c-peek" id="peek"><img alt="" src="read/frames/icarus.jpg"></div>

<script>
const F = 'read/frames/';

/* Only art that actually exists. Stories with none get a typographic plate —
   no stand-in images pretending to be something they are not. */
const STORIES = [
  { t:'Icarus',            k:'Animated Pilot', g:'Comedy / Sci-Fi',   img:F+'icarus.jpg',
    syn:'An overlooked 14-year-old misfit is chosen to lead a universe of alien species that have hidden their existence from humanity for ten billion years.' },
  { t:'Shuffle',           k:'Short Film',     g:'Horror',            img:F+'corridor.jpg',
    syn:'Some night shifts are quieter than others. For one laboratory worker, the silence is only the beginning. Based on a true story.' },
  { t:'NYC Midnight',      k:'Competition',    g:'Short Story',       img:F+'supply-room.jpg',
    syn:'Timed writing competitions across four seasons — 400 words in 48 hours, 2,000 in eight days, judged against thousands.' },
  { t:'Lyon Street',       k:'Novel',          g:'Biopic',            img:null,
    syn:'A teenage girl arrives in a foreign country barely speaking the language. She finds a close community of others like her, and together they make their way in a new world.' },
  { t:'Bombshell',         k:'Short Film',     g:'Comedy',            img:null,
    syn:'Four strangers, one room, and no way out until somebody admits what they did.' },
  { t:'God has No Family', k:'Feature',        g:'Thriller / Sci-Fi', img:null,
    syn:'A man erases everyone who shares his blood to claim what he believes is owed to him — then learns he missed one.' },
  { t:'Nostradamus',       k:'Feature',        g:'Romantic Comedy',   img:null,
    syn:'He can see exactly how it ends. He asks her out anyway.' },
];

const DESC = {
  a:'Even grid · tiles wipe up on a stagger · opens full-bleed with the same wipe',
  b:'Asymmetric collage · items rise and fade · opens a panel from the right, you keep your place',
  c:'No grid — a list · hover floats a preview where art exists · four columns lift away to open',
};

/* Three modes, so nothing is ever printed twice:
   'full'  — plate carries kicker + title + genre (nothing else names the story)
   'bare'  — kicker only (B: the caption underneath carries title + genre)
   'plain' — texture + rule only (A: the caption carries everything) */
function plate(s, mode){
  const big = mode === 'full';
  return `<div class="plate">
    <span class="no">NO ARTWORK YET</span>
    <div style="position:relative;padding:${big?'26px 26px 24px':'16px'}">
      ${mode==='plain' ? '' : `<div style="font-family:var(--fm);font-size:9px;letter-spacing:.2em;color:var(--gold);margin-bottom:6px">${s.k}</div>`}
      ${big ? `<div style="font-family:var(--fh);font-weight:600;font-size:30px;letter-spacing:-.015em">${s.t}</div>
               <div style="font-size:11px;color:var(--dim);margin-top:3px">${s.g}</div>` : ''}
      <div style="height:1px;background:var(--gold);opacity:.5;margin-top:${big?'16px':'10px'};width:${big?'70px':'34px'}"></div>
    </div>
  </div>`;
}
function media(s, mode){
  return s.img ? `<img src="${s.img}" alt="">` : plate(s, mode || 'bare');
}

/* ─── A ─── */
document.getElementById('aGrid').innerHTML = STORIES.map((s,i)=>`
  <article class="a-tile" data-i="${i}" style="transition-delay:${i*80}ms">
    ${media(s, 'plain')}
    <div class="cap">
      <div class="k" style="transition-delay:${i*80+240}ms">${s.k}</div>
      <div class="t" style="transition-delay:${i*80+310}ms">${s.t}</div>
      <div class="g" style="transition-delay:${i*80+380}ms">${s.g}</div>
    </div>
  </article>`).join('');

/* ─── B ─── */
/* Seven items, twelve columns, ten rows — checked so no two share a cell.
   Icarus takes the hero block; the text-only stories run as a band beneath. */
const AREA = [
  'grid-column:1/8;grid-row:1/8',    /* Icarus       */
  'grid-column:8/13;grid-row:1/5',   /* Shuffle      */
  'grid-column:8/13;grid-row:5/8',   /* NYC Midnight */
  'grid-column:1/4;grid-row:8/11',   /* Lyon Street  */
  'grid-column:4/7;grid-row:8/11',   /* Bombshell    */
  'grid-column:7/10;grid-row:8/11',  /* God has No Family */
  'grid-column:10/13;grid-row:8/11', /* Nostradamus  */
];
document.getElementById('bGrid').innerHTML = STORIES.map((s,i)=>`
  <article class="b-item" data-i="${i}" style="${AREA[i]};transition-delay:${i*85}ms">
    <div class="ph">${media(s, 'bare')}</div>
    <div class="meta"><span class="num">${String(i+1).padStart(2,'0')}</span>
      <span class="t">${s.t}</span><span class="g">${s.g}</span></div>
    <div class="ln"></div>
  </article>`).join('');

/* ─── C ─── */
document.getElementById('cList').innerHTML = STORIES.map((s,i)=>`
  <div class="c-row" data-i="${i}" style="transition-delay:${i*65}ms">
    <span class="num">${String(i+1).padStart(2,'0')}</span>
    <span class="t">${s.t}</span>
    ${s.img ? '' : '<span class="art">TEXT ONLY</span>'}
    <span class="g">${s.g}</span>
    <span class="bar2"></span>
  </div>`).join('');

/* ─── open states ─── */
const openFull = document.getElementById('openFull'),
      side = document.getElementById('side'), scrim = document.getElementById('scrim'),
      peek = document.getElementById('peek'), peekImg = peek.querySelector('img');

function openWipe(s, centre){
  openFull.className = 'open wipe on' + (centre ? ' centre' : '');
  openFull.innerHTML = `
    <div class="art">${s.img ? `<img src="${s.img}" alt="">` : plate(s, 'bare')}</div>
    ${centre ? '<div class="bars"><i></i><i></i><i></i><i></i></div>' : ''}
    <button class="closeX" data-close>✕</button>
    <div class="copy"><div class="in">
      <div class="k">${s.k} · ${s.g}</div>
      <h3>${s.t}</h3>
      <p class="syn">${s.syn}</p>
      <a class="act" href="#" data-close>Read →</a>
    </div></div>`;
}
function openBars(s){
  openFull.className = 'open centre on';
  openFull.innerHTML = `
    <div class="art">${s.img ? `<img src="${s.img}" alt="">` : plate(s, 'bare')}</div>
    <div class="bars"><i></i><i></i><i></i><i></i></div>
    <button class="closeX" data-close>✕</button>
    <div class="copy"><div class="in">
      <div class="k">${s.k} · ${s.g}</div>
      <h3>${s.t}</h3>
      <p class="syn">${s.syn}</p>
      <a class="act" href="#" data-close>Read →</a>
    </div></div>`;
}
function openSide(s){
  side.innerHTML = `
    <div class="hero">${s.img ? `<img src="${s.img}" alt="">` : plate(s, 'bare')}
      <button class="closeX" data-close style="top:14px;right:14px">✕</button></div>
    <div class="inner">
      <div class="k">${s.k}</div><h3>${s.t}</h3>
      <p class="syn">${s.syn}</p>
      <div><span class="pill">${s.g}</span><span class="pill">${s.k}</span></div>
    </div>`;
  side.classList.add('on'); scrim.classList.add('on');
}
function closeAll(){
  openFull.classList.remove('on'); side.classList.remove('on'); scrim.classList.remove('on');
  peek.classList.remove('on');
}

document.getElementById('aGrid').onclick = e=>{ const n=e.target.closest('.a-tile'); if(n) openWipe(STORIES[+n.dataset.i]); };
document.getElementById('bGrid').onclick = e=>{ const n=e.target.closest('.b-item'); if(n) openSide(STORIES[+n.dataset.i]); };
document.getElementById('cList').onclick = e=>{ const n=e.target.closest('.c-row'); if(n) openBars(STORIES[+n.dataset.i]); };

const cList = document.getElementById('cList');
cList.addEventListener('mousemove', e=>{
  const r = e.target.closest('.c-row');
  const s = r ? STORIES[+r.dataset.i] : null;
  if(!s || !s.img){ peek.classList.remove('on'); return; }
  peekImg.src = s.img;
  peek.style.left = e.clientX+'px'; peek.style.top = e.clientY+'px';
  peek.classList.add('on');
});
cList.addEventListener('mouseleave', ()=>peek.classList.remove('on'));

scrim.onclick = closeAll;
document.addEventListener('click', e=>{ if(e.target.closest('[data-close]')){ e.preventDefault(); closeAll(); } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAll(); });

/* ─── tabs + reveal ───
   Replay has to strip transitions before clearing the class, or the items
   animate *out* and the re-add just reverses them mid-flight — which looks
   like nothing happened at all. */
const SEL = { a:'#aGrid .a-tile', b:'#bGrid .b-item', c:'#cList .c-row' };
let current = 'a';

function play(v){
  const nodes = document.querySelectorAll(SEL[v]);
  const host  = document.getElementById('v'+v);
  host.classList.add('resetting');
  nodes.forEach(n=>n.classList.remove('in'));
  void host.offsetWidth;                 // force the reset to land
  host.classList.remove('resetting');
  void host.offsetWidth;
  setTimeout(function(){ nodes.forEach(function(n){ n.classList.add('in'); }); }, 30);
}

function show(v){
  current = v;
  ['a','b','c'].forEach(k=>document.getElementById('v'+k).classList.toggle('on', k===v));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  document.getElementById('desc').textContent = DESC[v];
  closeAll();
  play(v);
}
document.getElementById('tabs').onclick = e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.v); };
document.getElementById('replay').onclick = ()=>play(current);
document.addEventListener('keydown', e=>{
  const i = ['a','b','c'].indexOf(current);
  if(e.key==='ArrowRight') show(['a','b','c'][(i+1)%3]);
  if(e.key==='ArrowLeft')  show(['a','b','c'][(i+2)%3]);
});

/* deep-link: story-options.html#b opens the collage straight away */
function fromHash(){ const v = location.hash.replace('#','').toLowerCase(); return ['a','b','c'].includes(v) ? v : 'a'; }
window.addEventListener('hashchange', ()=>show(fromHash()));
show(fromHash());
</script>
</body>
