<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Shift1 — Portfolio Lab</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   REVIEW CHROME — a tool for comparing, not part of any design.
   Deliberately styled unlike the concepts so it never reads as UI
   that belongs to the page.
   ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
button{font:inherit;background:none;border:0;color:inherit;cursor:pointer}
:root{
  --bg:#080808; --ink:#e8e4de; --dim:#8a8580; --faint:#4a4642;
  --gold:#e8d5a3;
  --fh:'Space Grotesk',sans-serif; --fb:'Inter',sans-serif; --fm:'Space Mono',monospace;
  --bar:38px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-weight:300;
  -webkit-font-smoothing:antialiased;overflow:hidden}

#review{position:fixed;inset:0 0 auto 0;height:var(--bar);z-index:900;
  display:flex;align-items:center;gap:4px;padding:0 12px;
  background:#121212;border-bottom:1px solid #262626;
  font-family:var(--fm);font-size:10px;letter-spacing:.1em;color:#6d6862}
#review .tag{color:#4a4642;padding-right:8px;white-space:nowrap}
#review button{padding:5px 9px;border-radius:3px;color:#8d8880;white-space:nowrap;
  font-family:var(--fm);font-size:10px;letter-spacing:.06em;transition:.14s}
#review button:hover{color:#e8e4de;background:#1c1c1c}
#review button.on{background:#e8d5a3;color:#101010}
#review .sp{flex:1}
#pause{border:1px solid #303030}
#pause.on{background:#3a2f18;color:var(--gold);border-color:#5a4a26}

/* ══════════════════════════════════════════════════════════════
   SHARED — nav, dust, stage
   ══════════════════════════════════════════════════════════════ */
#site{position:fixed;inset:var(--bar) 0 0 0;overflow:hidden}

nav{position:absolute;top:0;left:0;right:0;height:64px;z-index:60;
  display:flex;align-items:center;justify-content:space-between;padding:0 40px;
  pointer-events:none}
nav a{pointer-events:auto;text-decoration:none;color:inherit}
.wordmark{font-family:var(--fh);font-size:14px;font-weight:600;letter-spacing:.16em}
.wordmark i{color:var(--gold);font-style:normal}
.navlinks{display:flex;gap:26px;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
.navlinks a:hover{color:var(--ink)}

/* dust — projector motes, not stars.  Few, warm, soft, uneven. */
#dust{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden;opacity:0}
.concept.hasdust ~ #dust, #dust.show{opacity:1}
.mote{position:absolute;border-radius:50%;background:#e8d5a3;
  animation:drift linear infinite}
@keyframes drift{
  0%   {opacity:0;           transform:translate3d(0,0,0) scale(1)}
  12%  {opacity:var(--o)}
  55%  {opacity:calc(var(--o) * .35); transform:translate3d(var(--dx),-42vh,0) scale(1.15)}
  88%  {opacity:calc(var(--o) * .7)}
  100% {opacity:0;           transform:translate3d(calc(var(--dx) * 1.7),-88vh,0) scale(.9)}
}

.concept{position:absolute;inset:0;display:none;padding:74px 40px 34px}
.concept.on{display:block}
.stage{position:relative;width:100%;height:100%}

/* titles used across concepts */
.ttl{font-family:var(--fh);font-weight:500;letter-spacing:-.005em}
.meta{font-family:var(--fm);font-size:9px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--faint)}
.head{position:absolute;top:0;left:0;font-family:var(--fh);font-size:12px;font-weight:500;
  letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.head b{color:var(--faint);font-weight:400;display:block;margin-top:5px;
  font-family:var(--fm);font-size:9px;letter-spacing:.17em}

img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}

/* motion off — for inspecting static composition */
body.paused *,body.paused *::before,body.paused *::after{
  animation-play-state:paused!important;transition:none!important}

/* ══════ 01 · FLOATING PRINTS ══════════════════════════════ */
#c1 .print{position:absolute;cursor:pointer;
  transform:translate3d(var(--sx),var(--sy),0) rotate(var(--sr));
  opacity:0;
  transition:opacity .9s ease, transform 1.25s cubic-bezier(.19,.82,.28,1)}
#c1 .print.in{opacity:1;transform:translate3d(0,0,0) rotate(var(--r))}
#c1 .sheet{position:relative;box-shadow:0 26px 60px rgba(0,0,0,.66);
  transition:transform .5s cubic-bezier(.2,.8,.3,1), box-shadow .5s}
#c1 .print:hover{z-index:30}
#c1 .print:hover .sheet{transform:translateY(-7px) scale(1.022);
  box-shadow:0 38px 80px rgba(0,0,0,.78)}
#c1 .print:hover{--r:0deg}
#c1 .cap{margin-top:11px;display:flex;align-items:baseline;gap:10px}
#c1 .cap .ttl{font-size:14.5px;color:#cfcac3;transition:color .35s}
#c1 .print:hover .cap .ttl{color:var(--ink)}
#c1 .cap .meta{opacity:0;transform:translateY(-2px);transition:.35s}
#c1 .print:hover .cap .meta{opacity:1;transform:none}

/* ══════ 02 · EDITORIAL COLLAGE ════════════════════════════ */
#c2 .grid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(10,1fr);
  gap:16px;width:100%;height:100%}
#c2 .pc{position:relative;overflow:visible;cursor:pointer;
  opacity:0;transform:translateY(16px);
  transition:opacity .7s ease,transform .9s cubic-bezier(.19,.82,.28,1)}
#c2 .pc.in{opacity:1;transform:none}
#c2 .pc .fr{position:absolute;inset:0;overflow:hidden;box-shadow:0 18px 46px rgba(0,0,0,.6)}
#c2 .hero .lab{padding:48px 20px 16px}
#c2 .pc img{transition:transform 1.1s cubic-bezier(.2,.8,.3,1)}
#c2 .pc:hover img{transform:scale(1.025)}
#c2 .lab{position:absolute;left:0;right:0;bottom:0;z-index:2;
  display:flex;align-items:baseline;gap:9px;padding:34px 16px 13px;
  background:linear-gradient(to top,rgba(8,8,8,.88),rgba(8,8,8,0))}
#c2 .lab .ttl{font-size:13px;color:#dad5ce}
#c2 .lab .meta{opacity:0;transition:.3s}
#c2 .pc:hover .lab .meta{opacity:1}
#c2 .pc:hover{z-index:20}
/* the hero interrupts the column it sits beside */
/* the hero interrupts the row BELOW it, not the column beside it —
   overhanging sideways buried its neighbours' titles */
#c2 .hero .fr{inset:0 0 -24px 0}
#c2 .hero .lab .ttl{font-size:21px;color:var(--ink)}

/* ══════ 03 · FEATURED STORY ═══════════════════════════════ */
#c3 .feat{position:relative;height:62%;overflow:hidden}
#c3 .feat .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
#c3 .feat .slide.on{opacity:1}
#c3 .feat .slide img{transform:scale(1.03);animation:slowpush 14s ease-out forwards}
@keyframes slowpush{to{transform:scale(1.085)}}
#c3 .veil{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(8,8,8,.92) 0%,rgba(8,8,8,.25) 38%,transparent 62%)}
#c3 .ftxt{position:absolute;left:0;bottom:26px;z-index:3;transition:opacity .4s ease}
#c3 .ftxt.sw{opacity:0}
#c3 .ftxt .ttl{font-size:44px;font-weight:600;line-height:1.05}
#c3 .ftxt .meta{margin-top:9px;color:var(--dim)}
#c3 .thumbs{display:flex;gap:14px;height:calc(38% - 26px);margin-top:26px}
#c3 .th{flex:1;position:relative;overflow:hidden;cursor:pointer;filter:brightness(.42) saturate(.85);
  transition:filter .5s, transform .5s}
#c3 .th.on,#c3 .th:hover{filter:none;transform:translateY(-5px)}
#c3 .th .tn{position:absolute;left:11px;bottom:9px;font-family:var(--fh);font-size:11.5px;
  letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.9)}
#c3 .th::after{content:'';position:absolute;inset:auto 0 0 0;height:2px;background:var(--gold);
  transform:scaleX(0);transform-origin:left;transition:transform .5s}
#c3 .th.on::after{transform:scaleX(1)}

/* ══════ 04 · FILMSTRIP ════════════════════════════════════ */
#c4 .rail{position:absolute;top:50%;left:0;right:0;transform:translateY(-54%);
  display:flex;align-items:center;gap:26px;overflow-x:auto;overflow-y:hidden;
  padding:30px 0 64px;scrollbar-width:none;cursor:grab;scroll-snap-type:x proximity}
#c4 .rail::-webkit-scrollbar{display:none}
#c4 .rail.drag{cursor:grabbing;scroll-snap-type:none}
#c4 .sp{flex:0 0 auto}
#c4 .fr{flex:0 0 auto;position:relative;overflow:hidden;scroll-snap-align:center;
  box-shadow:0 22px 58px rgba(0,0,0,.66);
  transition:transform .55s cubic-bezier(.2,.8,.3,1),filter .55s,opacity .55s;
  filter:brightness(.52);opacity:.82;opacity:0}
#c4 .fr.in{opacity:.82}
#c4 .fr.mid{filter:none;opacity:1;transform:scale(1.045)}
#c4 .cap{position:absolute;left:0;right:0;bottom:-46px;text-align:center;opacity:0;
  transition:opacity .45s}
#c4 .fr.mid .cap{opacity:1}
#c4 .cap .ttl{font-size:16px}
#c4 .cap .meta{margin-top:4px}

/* ══════ 05 · ASYMMETRIC GALLERY ═══════════════════════════ */
#c5 .wall{display:flex;flex-direction:column;height:100%;gap:26px}
#c5 .row{display:flex;gap:30px;align-items:flex-end;flex:var(--rf,1) 1 0;min-height:0}
#c5 .art{position:relative;cursor:pointer;height:var(--ah,100%);min-height:0;
  display:flex;flex-direction:column;justify-content:flex-end;
  opacity:0;transform:translateY(14px);
  transition:opacity .7s ease,transform .85s cubic-bezier(.19,.82,.28,1)}
#c5 .art.in{opacity:1;transform:none}
#c5 .art .fr{overflow:hidden;flex:1;min-height:0}
#c5 .art img{transition:transform 1.2s cubic-bezier(.2,.8,.3,1)}
#c5 .art:hover img{transform:scale(1.03)}
#c5 .cap{flex:0 0 auto;margin-top:11px;display:flex;align-items:baseline;gap:9px}
#c5 .cap .ttl{font-size:12.5px;color:#bdb8b1;font-weight:400;letter-spacing:.04em}
#c5 .cap .meta{opacity:0;transition:.3s}
#c5 .art:hover .cap .meta{opacity:1}

/* ══════ 06 · POSTER WALL ══════════════════════════════════ */
#c6 .wall{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;
  gap:52px 46px;height:100%;align-content:center}
#c6 .p{position:relative;cursor:pointer;opacity:0;transform:translateY(18px) scale(.985);
  transition:opacity .75s ease,transform .95s cubic-bezier(.19,.82,.28,1)}
#c6 .p.in{opacity:1;transform:none}
/* no panel, no border — the image is the object */
#c6 .p img{filter:drop-shadow(0 30px 44px rgba(0,0,0,.72));
  transition:transform .7s cubic-bezier(.2,.8,.3,1),filter .7s}
#c6 .p:hover img{transform:translateY(-8px) scale(1.012);
  filter:drop-shadow(0 42px 62px rgba(0,0,0,.85))}
#c6 .cap{text-align:center;margin-top:14px}
#c6 .cap .ttl{font-size:13px;color:#cbc6bf;letter-spacing:.03em}
#c6 .cap .meta{margin-top:5px;opacity:0;transition:.35s}
#c6 .p:hover .cap .meta{opacity:1}

/* ══════ 07 · SPOTLIGHT / DARKROOM ═════════════════════════ */
#c7 .grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
  gap:22px;height:100%}
#c7 .cell{position:relative;overflow:hidden;cursor:pointer;
  filter:brightness(.3) saturate(.7) contrast(.95);
  transform:scale(.985);
  transition:filter .75s cubic-bezier(.3,.7,.3,1),transform .75s cubic-bezier(.3,.7,.3,1);
  opacity:0}
#c7 .cell.in{opacity:1}
#c7 .cell.lit{filter:none;transform:scale(1)}
#c7 .cell .tx{position:absolute;left:18px;bottom:15px;opacity:.22;transition:opacity .6s}
#c7 .cell.lit .tx{opacity:1}
#c7 .cell .ttl{font-size:15px;text-shadow:0 2px 14px rgba(0,0,0,.9)}
#c7 .cell .meta{margin-top:4px;color:#9a948c}

/* ══════ 08 · RUNNING ORDER ════════════════════════════════ */
#c8 .stack{display:flex;flex-direction:column;height:100%;gap:5px}
#c8 .slat{position:relative;overflow:hidden;cursor:pointer;
  flex:var(--f,1) 1 0;min-height:0;opacity:0;
  transition:flex-grow .7s cubic-bezier(.22,.8,.3,1),opacity .6s ease,filter .6s}
#c8 .slat.in{opacity:1}
#c8 .slat img{filter:brightness(.62) saturate(.9);transition:filter .7s,transform 1.4s}
#c8 .slat:hover img{filter:brightness(1) saturate(1);transform:scale(1.015)}
#c8 .bar{position:absolute;inset:0;display:flex;align-items:center;gap:20px;
  padding:0 26px;pointer-events:none}
#c8 .no{font-family:var(--fm);font-size:10px;letter-spacing:.2em;color:var(--gold);opacity:.75}
#c8 .slat .ttl{font-size:clamp(17px,1.9vw,30px);font-weight:600;
  text-shadow:0 2px 20px rgba(0,0,0,.92)}
#c8 .slat .meta{margin-left:auto;opacity:0;transform:translateX(-6px);transition:.45s;
  color:#9a948c}
#c8 .slat:hover .meta{opacity:1;transform:none}
#c8 .edge{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);
  transform:scaleY(0);transform-origin:top;transition:transform .55s}
#c8 .slat:hover .edge{transform:scaleY(1)}

@media (max-width:1100px){
  .concept{padding:70px 22px 26px}
  #c7 .grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}
}
</style>
</head>
<body>

<div id="review">
  <span class="tag">REVIEW TOOL — NOT PART OF THE DESIGN</span>
  <span id="tabs"></span>
  <span class="sp"></span>
  <button id="pause">PAUSE MOTION</button>
</div>

<div id="site">
  <nav>
    <a href="#" class="wordmark">SH<i>1</i>FT</a>
    <div class="navlinks"><a href="#">Stories</a><a href="#">Contact</a></div>
  </nav>
  <div id="dust"></div>

  <section class="concept hasdust" id="c1"><div class="stage">
    <div class="head">Selected Stories<b>Films · Pilots · Novels · Stories</b></div>
  </div></section>

  <section class="concept" id="c2"><div class="stage">
    <div class="grid"></div>
  </div></section>

  <section class="concept hasdust" id="c3"><div class="stage">
    <div class="feat"><div class="veil"></div><div class="ftxt"></div></div>
    <div class="thumbs"></div>
  </div></section>

  <section class="concept hasdust" id="c4"><div class="stage">
    <div class="head">Selected Stories</div>
    <div class="rail"></div>
  </div></section>

  <section class="concept" id="c5"><div class="stage"><div class="wall"></div></div></section>

  <section class="concept hasdust" id="c6"><div class="stage">
    <div class="head">Selected Stories</div>
    <div class="wall"></div>
  </div></section>

  <section class="concept hasdust" id="c7"><div class="stage"><div class="grid"></div></div></section>

  <section class="concept hasdust" id="c8"><div class="stage"><div class="stack"></div></div></section>
</div>

<script>
/* ── the existing artwork, nothing new ────────────────────── */
const F = 'read/frames/';
const P = [
  { t:'Shuffle',           m:'Short Film · Horror',          img:F+'shuffle-tile.jpg' },
  { t:'Icarus',            m:'Animated Pilot · Comedy / Sci-Fi', img:F+'icarus.jpg' },
  { t:'Lyon Street',       m:'Novel · Biopic',               img:F+'lyon-street.jpg' },
  { t:'Bombshell',         m:'Feature · Comedy',             img:F+'bombshell.jpg' },
  { t:'God has No Family', m:'Feature · Thriller / Sci-Fi',  img:F+'god-has-no-family.jpg' },
  { t:'Nostradamus',       m:'Feature · Romantic Comedy',    img:F+'nostradamus.jpg' },
];
const SHUFFLE=0, ICARUS=1, LYON=2, BOMB=3, GOD=4, NOSTRA=5;
const im  = p => `<img src="${p.img}" alt="${p.t}" draggable="false">`;
const cap = p => `<span class="ttl">${p.t}</span><span class="meta">${p.m}</span>`;

const CONCEPTS = [
  ['01','Floating Prints'],['02','Editorial Collage'],['03','Featured Story'],['04','Filmstrip'],
  ['05','Asymmetric Gallery'],['06','Poster Wall'],['07','Spotlight'],['08','Running Order'],
];

/* ── dust: few, warm, uneven — motes in projector light ───── */
(function(){
  const d = document.getElementById('dust');
  for(let i=0;i<16;i++){
    const m = document.createElement('div');
    m.className = 'mote';
    const s = 1 + Math.random()*2.4;                 /* mostly sub-pixel specks */
    m.style.width = s+'px'; m.style.height = s+'px';
    m.style.left = (Math.random()*100)+'%';
    m.style.top  = (78 + Math.random()*36)+'%';
    m.style.setProperty('--o', (0.10 + Math.random()*0.30).toFixed(2));
    m.style.setProperty('--dx', (Math.random()*90-45)+'px');
    m.style.filter = `blur(${(Math.random()*1.1).toFixed(2)}px)`;
    m.style.animationDuration = (26 + Math.random()*34)+'s';
    m.style.animationDelay = (-Math.random()*50)+'s';
    d.appendChild(m);
  }
})();

/* ══════ 01 · FLOATING PRINTS ══════════════════════════════ */
/* hand-placed, deliberately asymmetric, nothing overlapping */
const LAY1 = [
  { i:ICARUS, x: 3,  y:14, w:31, r:-1.2 },
  { i:SHUFFLE,x:38,  y: 8, w:27, r: 0.9 },
  { i:LYON,   x:69,  y:17, w:28, r:-0.6 },
  { i:GOD,    x: 9,  y:56, w:25, r: 1.1 },
  { i:NOSTRA, x:39,  y:50, w:30, r:-0.9 },
  { i:BOMB,   x:74,  y:61, w:22, r: 1.3 },
];
function build1(){
  const st = document.querySelector('#c1 .stage');
  st.querySelectorAll('.print').forEach(n=>n.remove());
  st.insertAdjacentHTML('beforeend', LAY1.map((L,k)=>{
    const p = P[L.i];
    const sx = (k%2?-1:1)*(16+k*5), sy = 26+k*7, sr = L.r + (k%2?2.6:-2.4);
    return `<div class="print" data-k="${k}" style="
        left:${L.x}%;top:${L.y}%;width:${L.w}%;
        --r:${L.r}deg;--sx:${sx}px;--sy:${sy}px;--sr:${sr}deg;
        transition-delay:${90+k*95}ms">
      <div class="sheet">${im(p)}</div>
      <div class="cap">${cap(p)}</div>
    </div>`;
  }).join(''));
}

/* ══════ 02 · EDITORIAL COLLAGE ════════════════════════════ */
const LAY2 = [
  { i:ICARUS, c:'1 / 8',  r:'1 / 7',  hero:true },
  { i:NOSTRA, c:'8 / 13', r:'1 / 4' },
  { i:LYON,   c:'8 / 13', r:'4 / 7' },
  { i:SHUFFLE,c:'1 / 5',  r:'7 / 11' },
  { i:GOD,    c:'5 / 9',  r:'7 / 11' },
  { i:BOMB,   c:'9 / 13', r:'7 / 11' },
];
document.querySelector('#c2 .grid').innerHTML = LAY2.map((L,k)=>{
  const p = P[L.i];
  return `<article class="pc${L.hero?' hero':''}" style="grid-column:${L.c};grid-row:${L.r};
      z-index:${L.hero?5:1};transition-delay:${80+k*85}ms">
    <div class="fr">${im(p)}</div>
    <div class="lab">${cap(p)}</div>
  </article>`;
}).join('');

/* ══════ 03 · FEATURED STORY ═══════════════════════════════ */
document.querySelector('#c3 .feat').insertAdjacentHTML('afterbegin',
  P.map((p,k)=>`<div class="slide" data-k="${k}">${im(p)}</div>`).join(''));
document.querySelector('#c3 .thumbs').innerHTML =
  P.map((p,k)=>`<div class="th" data-k="${k}">${im(p)}<div class="tn">${p.t}</div></div>`).join('');
let feat = 0, featTimer = null;
let swapT = null;
function setFeat(k){
  feat = k;
  document.querySelectorAll('#c3 .slide').forEach((s,j)=>s.classList.toggle('on', j===k));
  document.querySelectorAll('#c3 .th').forEach((t,j)=>t.classList.toggle('on', j===k));
  /* the title rides the crossfade instead of snapping a second ahead of it */
  const tx = document.querySelector('#c3 .ftxt');
  const write = ()=>{ tx.innerHTML =
    `<div class="ttl">${P[k].t}</div><div class="meta">${P[k].m}</div>`; };
  clearTimeout(swapT);
  if(!tx.innerHTML.trim()){ write(); return; }
  tx.classList.add('sw');
  swapT = setTimeout(()=>{ write(); tx.classList.remove('sw'); }, 300);
}
document.querySelector('#c3 .thumbs').addEventListener('mouseover', e=>{
  const t = e.target.closest('.th'); if(t) { setFeat(+t.dataset.k); restartFeat(); }
});
function restartFeat(){
  clearInterval(featTimer);
  if(cur===2 && !paused) featTimer = setInterval(()=>setFeat((feat+1)%P.length), 5200);
}

/* ══════ 04 · FILMSTRIP ════════════════════════════════════ */
function build4(){
  const rail = document.querySelector('#c4 .rail');
  const H = document.querySelector('#c4 .stage').clientHeight;
  const fh = Math.max(220, Math.min(H*0.62, 430));
  const fw = Math.round(fh*1.78);
  const pad = Math.max(30, (document.documentElement.clientWidth - 80 - fw)/2);
  rail.innerHTML =
    `<div class="sp" style="width:${pad}px"></div>` +
    P.map((p,k)=>`<div class="fr" data-k="${k}"
        style="width:${fw}px;height:${fh}px;transition-delay:${70+k*70}ms">${im(p)}
      <div class="cap"><div class="ttl">${p.t}</div><div class="meta">${p.m}</div></div>
    </div>`).join('') +
    `<div class="sp" style="width:${pad}px"></div>`;
  /* open on the second frame so a neighbour peeks in from either side */
  const second = rail.querySelectorAll('.fr')[1];
  rail.scrollLeft = second ? second.offsetLeft - (rail.clientWidth - fw)/2 : 0;
  mark4();
}
function mark4(){
  const rail = document.querySelector('#c4 .rail');
  if(!rail) return;
  const mid = rail.getBoundingClientRect().left + rail.clientWidth/2;
  let best = null, bd = 1e9;
  rail.querySelectorAll('.fr').forEach(f=>{
    const b = f.getBoundingClientRect(), d = Math.abs(b.left + b.width/2 - mid);
    if(d < bd){ bd = d; best = f; }
  });
  rail.querySelectorAll('.fr').forEach(f=>f.classList.toggle('mid', f===best));
}
(function(){
  const rail = document.querySelector('#c4 .rail');
  rail.addEventListener('scroll', mark4, { passive:true });
  rail.addEventListener('wheel', e=>{
    if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ rail.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive:false });
  let down=false, moved=false, sx=0, sl=0;
  rail.addEventListener('pointerdown', e=>{ down=true;moved=false;sx=e.clientX;sl=rail.scrollLeft;
    rail.setPointerCapture(e.pointerId); });
  rail.addEventListener('pointermove', e=>{ if(!down) return;
    const dx=e.clientX-sx; if(!moved && Math.abs(dx)>5){moved=true;rail.classList.add('drag');}
    if(moved) rail.scrollLeft = sl-dx; });
  const up = e=>{ if(!down) return; down=false;
    if(moved) setTimeout(()=>rail.classList.remove('drag'),0);
    try{ rail.releasePointerCapture(e.pointerId); }catch(_){} };
  rail.addEventListener('pointerup', up); rail.addEventListener('pointercancel', up);
})();

/* ══════ 05 · ASYMMETRIC GALLERY ═══════════════════════════ */
/* gallery wall: varied widths and heights, hung to a baseline */
/* proportions, not pixels, so the wall always fits the window */
const LAY5 = [
  { rf:1.28, row:[ { i:ICARUS, w:46, ah:100 }, { i:LYON, w:27, ah:76 } ] },
  { rf:1.00, row:[ { i:SHUFFLE,w:24, ah:60  }, { i:GOD,  w:34, ah:100 }, { i:BOMB, w:20, ah:66 } ] },
  { rf:0.86, row:[ { i:NOSTRA, w:38, ah:100 } ] },
];
document.querySelector('#c5 .wall').innerHTML = LAY5.map((R,ri)=>
  `<div class="row" style="--rf:${R.rf}">${R.row.map((a,ci)=>{
    const p = P[a.i];
    return `<div class="art" style="width:${a.w}%;--ah:${a.ah}%;transition-delay:${70+(ri*3+ci)*80}ms">
      <div class="fr">${im(p)}</div>
      <div class="cap">${cap(p)}</div>
    </div>`;
  }).join('')}</div>`).join('');

/* ══════ 06 · POSTER WALL ══════════════════════════════════ */
/* sizes vary — the two that exist visually carry more weight */
const W6 = { [ICARUS]:30, [SHUFFLE]:27, [NOSTRA]:24, [GOD]:22, [LYON]:21, [BOMB]:19 };
document.querySelector('#c6 .wall').innerHTML =
  [ICARUS,SHUFFLE,LYON,NOSTRA,GOD,BOMB].map((i,k)=>{
    const p = P[i];
    return `<figure class="p" style="width:${W6[i]}%;transition-delay:${80+k*90}ms">
      ${im(p)}<figcaption class="cap">${cap(p)}</figcaption></figure>`;
  }).join('');

/* ══════ 07 · SPOTLIGHT ════════════════════════════════════ */
document.querySelector('#c7 .grid').innerHTML = P.map((p,k)=>
  `<div class="cell" data-k="${k}" style="transition-delay:${60+k*70}ms">${im(p)}
     <div class="tx"><div class="ttl">${p.t}</div><div class="meta">${p.m}</div></div></div>`).join('');
let litTimer = null, lit = 0;
function setLit(k){ lit = k;
  document.querySelectorAll('#c7 .cell').forEach((c,j)=>c.classList.toggle('lit', j===k)); }
document.querySelector('#c7 .grid').addEventListener('mouseover', e=>{
  const c = e.target.closest('.cell'); if(c){ setLit(+c.dataset.k); restartLit(); }
});
function restartLit(){
  clearInterval(litTimer);
  if(cur===6 && !paused) litTimer = setInterval(()=>setLit((lit+1)%P.length), 3400);
}

/* ══════ 08 · RUNNING ORDER ════════════════════════════════ */
function build8(){
  const OPEN = 3.4, SHUT = 1;
  const st = document.querySelector('#c8 .stack');
  st.innerHTML = P.map((p,k)=>
    `<div class="slat" data-k="${k}" style="--f:${k===0?OPEN:SHUT};transition-delay:${70+k*80}ms">
       ${im(p)}<div class="edge"></div>
       <div class="bar"><span class="no">${String(k+1).padStart(2,'0')}</span>
         <span class="ttl">${p.t}</span><span class="meta">${p.m}</span></div>
     </div>`).join('');
  st.onmouseover = e=>{
    const s = e.target.closest('.slat'); if(!s) return;
    st.querySelectorAll('.slat').forEach(x=>
      x.style.setProperty('--f', x===s ? OPEN : SHUT));
  };
}

/* ══════ switcher, reveal, pause ═══════════════════════════ */
let cur = 0, paused = false;
document.getElementById('tabs').innerHTML =
  CONCEPTS.map((c,i)=>`<button data-i="${i}">${c[0]} ${c[1]}</button>`).join('');

function reveal(i){
  const sec = document.getElementById('c'+(i+1));
  const items = sec.querySelectorAll('.print,.pc,.fr[data-k],.art,.p,.cell,.slat');
  items.forEach(n=>n.classList.remove('in'));
  void sec.offsetWidth;
  /* a timeout, not requestAnimationFrame — rAF can be starved and the
     reveal then never fires at all */
  setTimeout(()=>items.forEach(n=>n.classList.add('in')), 40);
}
function show(i){
  cur = i;
  document.querySelectorAll('.concept').forEach((s,j)=>s.classList.toggle('on', j===i));
  document.querySelectorAll('#tabs button').forEach((b,j)=>b.classList.toggle('on', j===i));
  document.getElementById('dust').classList.toggle('show',
    document.getElementById('c'+(i+1)).classList.contains('hasdust'));
  if(i===0) build1();
  if(i===3) build4();
  if(i===7) build8();
  if(i===2) setFeat(0);
  if(i===6) setLit(0);
  clearInterval(featTimer); clearInterval(litTimer);
  restartFeat(); restartLit();
  reveal(i);
  if(i===3) setTimeout(mark4, 90);
  history.replaceState(null,'','#'+CONCEPTS[i][0]);
}
document.getElementById('tabs').onclick = e=>{
  const b = e.target.closest('button'); if(b) show(+b.dataset.i);
};
document.getElementById('pause').onclick = function(){
  paused = !paused;
  document.body.classList.toggle('paused', paused);
  this.classList.toggle('on', paused);
  this.textContent = paused ? 'MOTION PAUSED' : 'PAUSE MOTION';
  clearInterval(featTimer); clearInterval(litTimer);
  restartFeat(); restartLit();
};
addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') show((cur+1)%CONCEPTS.length);
  if(e.key==='ArrowLeft')  show((cur+CONCEPTS.length-1)%CONCEPTS.length);
  if(e.key>='1'&&e.key<='8') show(+e.key-1);
});
let rt; addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{
  if(cur===0) build1(); if(cur===3) build4(); if(cur===7) build8(); reveal(cur); },200); });

const want = CONCEPTS.findIndex(c=>c[0]===location.hash.replace('#',''));
show(want<0?0:want);
</script>
</body>
