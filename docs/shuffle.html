<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffle — Shift1 Studios</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0b0b0b;
      --text: #e8e4de;
      --text-muted: #8a8580;
      --accent: #e8d5a3;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    /* The page is one screen. Nothing below the fold, nothing to scroll to —
       dvh rather than vh so a phone's collapsing address bar can't push the
       sentence off the bottom. */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAV ─── */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(to bottom, var(--bg) 60%, transparent);
    }
    .nav-logo {
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--text);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .nav-links a:hover { color: var(--text); }

    /* ─── STAGE ─── */
    /* Sits under the bar and runs to the bottom of the viewport. Content is
       held at the top of that space, centred horizontally. */
    .stage {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5rem 3rem 1.5rem;
      gap: 0;
    }

    /* The film is as wide as it can be without the page needing to scroll:
       capped by the viewport, and by the height left after the bar, the padding
       and whatever sits below it. 16/9 turns that height budget into a width.

       --reserve is measured from the real block below rather than guessed in
       rem, because that block is one, two or three rows depending on width — a
       fixed guess is either too small (it clips) or too big (the film pays for
       headroom it never uses). The 9rem fallback is the safe end, for the case
       where the script never runs. */
    .col {
      width: min(1600px, 100%, (100dvh - 6.5rem - var(--reserve, 9rem)) * 16 / 9);
    }

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid rgba(232, 213, 163, 0.14);
      border-radius: 4px;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .player iframe, .player video { width: 100%; height: 100%; border: 0; display: block; }

    /* Poster facade: the embed is only fetched once someone asks for it, so the
       page costs nothing to load and YouTube sees no visit that isn't one. */
    .player-poster {
      position: absolute; inset: 0;
      background: url('read/frames/shuffle-tile-v2.png') center / cover no-repeat;
      display: grid; place-items: center;
      cursor: pointer; border: 0; padding: 0; width: 100%;
    }
    .player-poster::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(11, 11, 11, 0.45);
      transition: background 0.3s ease;
    }
    .player-poster:hover::after { background: rgba(11, 11, 11, 0.3); }
    .play-badge {
      position: relative; z-index: 2;
      display: flex; align-items: center; gap: 0.8rem;
      font-family: var(--font-heading);
      font-size: 0.78rem; font-weight: 500;
      letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--text);
      background: rgba(11, 11, 11, 0.72);
      border: 1px solid rgba(232, 213, 163, 0.45);
      border-radius: 3px;
      padding: 0.85rem 1.5rem;
    }
    .play-badge .tri {
      width: 0; height: 0;
      border-left: 10px solid var(--accent);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }

    /* Two columns: the link sizes column 2 to itself (auto), so the text in
       column 1 always stops one gutter short of where the link begins — no
       hardcoded width to drift if the link's wording or tracking changes. */
    .meta {
      display: grid;
      grid-template-columns: 1fr auto;
      column-gap: 1.5rem;
      margin-top: 0.6rem;
    }
    .under { grid-column: 2; grid-row: 1; justify-self: end; }
    .yt-link {
      font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); text-decoration: none;
      border-bottom: 1px solid rgba(232, 213, 163, 0.3);
      padding-bottom: 1px;
      transition: border-color 0.3s ease;
    }
    .yt-link:hover { border-color: var(--accent); }

    .line {
      grid-column: 1;
      grid-row: 2;
      margin-top: 1.1rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    @media (max-width: 760px) {
      nav { padding: 1.2rem 1.5rem; }
      .nav-links { gap: 1.4rem; }
      .stage { padding: 4.5rem 1.5rem 1.5rem; }
      .col { width: min(1600px, 100%, (100dvh - 6rem - var(--reserve, 11rem)) * 16 / 9); }
      /* At phone width the film is only ~340px across. Holding a column open
         for the link leaves the sentence about 180px and nine rows of text, so
         the grid collapses and the text takes the full width. */
      .meta { grid-template-columns: 1fr; }
      .under { grid-column: 1; }
      .line { grid-column: 1; margin-top: 1rem; font-size: 0.9rem; }
      /* The poster is a third of its desktop size here — at full scale the
         badge swallows it. */
      .play-badge { font-size: 0.66rem; letter-spacing: 0.18em; padding: 0.6rem 1rem; gap: 0.6rem; }
      .play-badge .tri { border-left-width: 8px; border-top-width: 5px; border-bottom-width: 5px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">SH1FT</a>
    <ul class="nav-links">
      <li><a href="index.html#projects">Projects</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>

  <main class="stage">
    <div class="col">
      <div class="player" id="player">
        <button class="player-poster" id="playBtn" aria-label="Play Shuffle">
          <span class="play-badge"><span class="tri"></span> Watch short</span>
        </button>
      </div>
      <div class="meta">
        <div class="under">
          <a class="yt-link" href="https://www.youtube.com/watch?v=q3-elUKAhjM"
             target="_blank" rel="noopener">Watch on YouTube &nearr;</a>
        </div>
        <p class="line">
          Made for the Higgsfield Film Festival, using Higgsfield's tools throughout. Intended
          to show a snippet of the story while testing how technology is going to change the
          way films are made.
        </p>
      </div>
    </div>
  </main>

  <script>
    /* youtube.com/watch?v=q3-elUKAhjM */
    const FILM = { kind: 'youtube', id: 'q3-elUKAhjM' };

    const player = document.getElementById('player');

    /* Feed the real height of the block below the film back into --reserve.
       It converges rather than solving in one pass: the block's height depends
       on its width, which depends on the reserve. Three passes is plenty —
       each style write forces the layout that the next read needs. */
    const root = document.documentElement;
    const meta = document.querySelector('.meta');
    function fit() {
      for (let i = 0; i < 3; i++) {
        const mt = parseFloat(getComputedStyle(meta).marginTop) || 0;
        root.style.setProperty('--reserve', (meta.offsetHeight + mt) + 'px');
      }
    }
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    addEventListener('resize', fit);

    document.getElementById('playBtn').addEventListener('click', function () {
      player.innerHTML =
        '<iframe src="https://www.youtube-nocookie.com/embed/' + FILM.id +
        '?autoplay=1&rel=0" title="Shuffle" allow="accelerometer; autoplay; clipboard-write; ' +
        'encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    });
  </script>

</body>
</html>
